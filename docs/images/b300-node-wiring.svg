<text x='1140' y='211' font-size='10' fill='#64748b'>单模 MPO</text>
<text x='1140' y='247' font-size='10' fill='#64748b'>单模 MPO</text>

<text x='708' y='282' font-size='11' fill='#334155'>· 8 张网卡 × 2 = 16 条 400G，其中 8 条入平面 1、8 条入平面 2</text>
<text x='708' y='300' font-size='11' fill='#334155'>· rail i 的两条链路落在「同 Pod、同 rail、不同平面」的两台 Leaf 上</text>
<text x='708' y='318' font-size='11' fill='#334155'>· 交换机为 128×400G 机型，拆出的 400G 直接插入，交换机侧无需二次 breakout</text>
<text x='708' y='336' font-size='11' font-weight='600' fill='#166534'>· 单平面异常时另一平面仍可通信，作业可降速运行而不中断</text>
<text x='708' y='358' font-size='10.5' fill='#64748b'>NCCL 必须正确识别全部 16 条链路，否则 All-Reduce 打不满带宽；需配置 GID index、流量类别与 MTU 9000</text>
<text x='708' y='374' font-size='10.5' fill='#64748b'>无损依赖：PFC + ECN / DCQCN（主机侧）与 AI ECN、Agile Buffer、Spraylink 逐包 AR（H3C 侧）</text>

