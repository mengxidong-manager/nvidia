<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 800' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1280' height='800' fill='#ffffff'/>
<rect x='0' y='0' width='1280' height='74' fill='#7c3aed'/>
<text x='34' y='34' font-size='20' font-weight='700' fill='#ffffff'>全机房带外管理网（OOB / IPMI）　两集群统一的一张网</text>
<text x='34' y='58' font-size='12.5' fill='#ddd6fe'>接入 S5590 × 9（B300 × 8 归 B300 + H200 × 1 归 H200）+ 汇聚 S6805 × 2 + B300 edge S9825 × 2 · 上行出口路由器（防火墙旁挂）· 与数据面完全物理隔离</text>

<rect x='30' y='92' width='1220' height='56' rx='7' fill='#faf8ff' stroke='#7c3aed' stroke-width='1.8'/>
<text x='46' y='113' font-size='12' font-weight='700' fill='#5b21b6'>本网的作用与覆盖范围</text>
<text x='46' y='133' font-size='11' fill='#334155'>承载 BMC / IPMI 流量：带外开关机、硬件告警、固件升级、串口重定向，以及 BCM 的 PXE 镜像化部署。※ 本网覆盖 B300 的 127 台节点与 H200 的 32 台节点。H200 有自己的 IPMI 接入交换机（C22 列 U33，归属 H200 台账），与 B300 的 8 台一同上行到同一对 B300 edge —— 两集群的 IPMI 是同一张网。</text>

<rect x='370' y='172' width='540' height='54' rx='7' fill='#eef6ff' stroke='#1d4ed8' stroke-width='2.2'/>
<text x='640' y='194' font-size='12.5' font-weight='700' fill='#0f172a' text-anchor='middle'>B300 edge 交换机　H3C S9825 × 2　（两集群 IPMI 共用）</text>
<text x='640' y='214' font-size='10.5' fill='#1d4ed8' text-anchor='middle'>C22 列 U17 / D22 列 U17　→　上行出口路由器 H3C CR16005E × 2（C22/D22 U13，防火墙旁挂）</text>
<line x1='640' y1='226' x2='640' y2='254' stroke='#7c3aed' stroke-width='2.6'/>
<path d='M 634 236 L 640 224 L 646 236 Z' fill='#7c3aed'/>
<text x='656' y='246' font-size='10' fill='#5b21b6'>IPMI Spine → B300 edge → 出口路由器</text>

<rect x='370' y='256' width='540' height='64' rx='7' fill='#ede9fe' stroke='#5b21b6' stroke-width='2.4'/>
<text x='640' y='280' font-size='13' font-weight='700' fill='#5b21b6' text-anchor='middle'>IPMI Spine　H3C S6805 × 2</text>
<text x='640' y='300' font-size='10.5' fill='#334155' text-anchor='middle'>C22 列 U40 / D22 列 U40　·　冗余部署</text>
<text x='640' y='315' font-size='10' fill='#64748b' text-anchor='middle'>本网的汇聚层，所有接入设备在此收口</text>

<rect x='120' y='344' width='1040' height='58' rx='6' fill='#fff8ec' stroke='#ea7317' stroke-width='2'/>
<text x='640' y='366' font-size='12.5' font-weight='700' fill='#9a3412' text-anchor='middle'>接入 ↔ Spine　全连接（full-mesh）</text>
<text x='640' y='387' font-size='11' fill='#334155' text-anchor='middle'>每台接入交换机双上行分别接两台 IPMI Spine；计算网 Leaf / Spine 也各以 2 × 10GE 分接两台 IPMI Spine　→　任一 Spine 故障不失管</text>

<line x1='300' y1='402' x2='300' y2='432' stroke='#7c3aed' stroke-width='2.4'/>
<path d='M 294 422 L 300 434 L 306 422 Z' fill='#7c3aed'/>
<line x1='644' y1='402' x2='644' y2='432' stroke='#9a3412' stroke-width='2.4'/>
<path d='M 638 422 L 644 434 L 650 422 Z' fill='#9a3412'/>
<line x1='1054' y1='402' x2='1054' y2='432' stroke='#0ea5b7' stroke-width='2.4'/>
<path d='M 1048 422 L 1054 434 L 1060 422 Z' fill='#0ea5b7'/>

<rect x='30' y='434' width='400' height='106' rx='7' fill='#ffffff' stroke='#5b21b6' stroke-width='1.8'/>
<text x='230' y='458' font-size='12.5' font-weight='700' fill='#5b21b6' text-anchor='middle'>B300 节点 IPMI 接入　S5590 × 8</text>
<text x='44' y='480' font-size='10.5' fill='#334155'>承接 127 台 B300 节点的 BMC 口</text>
<text x='44' y='498' font-size='10.5' fill='#334155'>每节点 1 × RJ45 铜缆，按机柜列就近部署</text>
<text x='44' y='516' font-size='10.5' fill='#334155'>每台双上行至两台 IPMI Spine</text>
<text x='44' y='533' font-size='10' fill='#64748b'>管理服务器 Leaf（S9825 ×2）走存储网骨干，不在本网</text>

<rect x='444' y='434' width='400' height='106' rx='7' fill='#fff8ec' stroke='#9a3412' stroke-width='2.2'/>
<text x='644' y='458' font-size='12.5' font-weight='700' fill='#9a3412' text-anchor='middle'>H200 节点 IPMI 接入　S5590 × 1（归 H200）</text>
<text x='458' y='480' font-size='11' font-weight='700' fill='#9a3412'>位置：C22 列 U33</text>
<text x='458' y='498' font-size='10.5' fill='#334155'>承接 32 台 H200 节点的 BMC 口</text>
<text x='458' y='516' font-size='10.5' fill='#334155'>同样双上行至两台 IPMI Spine</text>
<text x='458' y='533' font-size='10' font-weight='600' fill='#9a3412'>→ 交换机归属 H200，但与 B300 同属一张 IPMI 网</text>
<rect x='858' y='434' width='392' height='106' rx='7' fill='#ffffff' stroke='#0ea5b7' stroke-width='1.8'/>
<text x='1054' y='458' font-size='12.5' font-weight='700' fill='#0e7490' text-anchor='middle'>网络设备自身的带外接入</text>
<text x='872' y='480' font-size='10.5' fill='#334155'>计算网 Leaf ×32 与 Spine ×16，各 2 × 10GE</text>
<text x='872' y='498' font-size='10.5' fill='#334155'>合计 48 台 × 2 = 96 条 10GE 管理链路</text>
<text x='872' y='516' font-size='10.5' font-weight='600' fill='#166534'>失联时仍可带外登录排障</text>
<text x='872' y='533' font-size='10' fill='#64748b'>存储网各类 Leaf 与骨干管理口同样并入</text>

<line x1='230' y1='540' x2='230' y2='570' stroke='#16a34a' stroke-width='2.4'/>
<path d='M 224 560 L 230 572 L 236 560 Z' fill='#16a34a'/>
<line x1='644' y1='540' x2='644' y2='570' stroke='#16a34a' stroke-width='2.4'/>
<path d='M 638 560 L 644 572 L 650 560 Z' fill='#16a34a'/>

<rect x='30' y='572' width='400' height='78' rx='7' fill='#f6fdf8' stroke='#16a34a' stroke-width='1.8'/>
<text x='230' y='594' font-size='12' font-weight='700' fill='#166534' text-anchor='middle'>B300 计算节点 × 127　BMC</text>
<text x='230' y='614' font-size='10.5' fill='#334155' text-anchor='middle'>ASPEED AST2600 · 1 × RJ45 专用 IPMI 口</text>
<text x='230' y='631' font-size='10.5' fill='#334155' text-anchor='middle'>另有 2 × 10GbE 板载 LAN</text>
<text x='230' y='645' font-size='10' fill='#15803d' text-anchor='middle'>IPMI 口与计算网 OSFP、存储网 200G 口物理分离</text>
<rect x='444' y='572' width='400' height='78' rx='7' fill='#fff8ec' stroke='#9a3412' stroke-width='1.8'/>
<text x='644' y='594' font-size='12' font-weight='700' fill='#9a3412' text-anchor='middle'>H200 计算节点 × 32　BMC</text>
<text x='644' y='614' font-size='10.5' fill='#334155' text-anchor='middle'>Aivres KR6288 V2 · A 列 20 台 + B 列 12 台</text>
<text x='644' y='631' font-size='10.5' fill='#334155' text-anchor='middle'>BMC 口接入 C22 列 U33 的 S5590</text>
<text x='644' y='645' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>H200 的计算网与存储网自成体系，带外管理与 B300 同网</text>

<rect x='858' y='572' width='392' height='78' rx='7' fill='#f0fcff' stroke='#0ea5b7' stroke-width='1.8'/>
<text x='1054' y='594' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>计算网与存储网设备　管理口</text>
<text x='1054' y='614' font-size='10.5' fill='#334155' text-anchor='middle'>LS9867-128DH ×48 · S9825 ×30（含骨干 16）</text>
<text x='1054' y='631' font-size='10.5' fill='#334155' text-anchor='middle'>每台两条 10GE，分接两台 IPMI Spine</text>
<text x='1054' y='645' font-size='10' fill='#0e7490' text-anchor='middle'>构成完整的「设备带外可达」闭环</text>

<rect x='30' y='668' width='400' height='118' rx='7' fill='#ffffff' stroke='#64748b' stroke-width='1.5'/>
<text x='44' y='690' font-size='12' font-weight='700' fill='#0f172a'>台账　13 台（含共用 edge 2 台）</text>
<text x='44' y='712' font-size='10.5' fill='#334155'>IPMI 接入　H3C S5590 × 9（B300 ×8 + H200 ×1，各计本集群）</text>
<text x='44' y='730' font-size='10.5' fill='#334155'>IPMI Spine　S6805 × 2　·　B300 edge　S9825 × 2</text>
<text x='44' y='752' font-size='10.5' fill='#334155'>介质　铜缆（节点）+ 10GE（设备管理口）</text>
<text x='44' y='772' font-size='10' fill='#64748b'>C22U33 那台计入 H200 的 33 台，其余 8 台计入 B300 的 74 台</text>

<rect x='444' y='668' width='400' height='118' rx='7' fill='#ffffff' stroke='#5b21b6' stroke-width='1.5'/>
<text x='458' y='690' font-size='12' font-weight='700' fill='#5b21b6'>隔离的工程价值</text>
<text x='458' y='712' font-size='10.5' fill='#334155'>· 与计算网、存储网不共用任何设备与链路</text>
<text x='458' y='730' font-size='10.5' fill='#334155'>· 数据面拥塞或配置失误不影响带外可达性</text>
<text x='458' y='748' font-size='10.5' fill='#334155'>· 支撑 BCM 镜像化部署：PXE 走本网下发</text>
<text x='458' y='766' font-size='10.5' fill='#334155'>· 掉卡 / 宕机场景下的首选排障入口</text>
<text x='458' y='781' font-size='10' font-weight='600' fill='#9a3412'>· B300 edge（C22/D22 U17）故障会同时影响两集群</text>

<rect x='858' y='668' width='392' height='118' rx='7' fill='#ffffff' stroke='#9a3412' stroke-width='1.5'/>
<text x='872' y='690' font-size='12' font-weight='700' fill='#9a3412'>与数据面的对照</text>
<text x='872' y='712' font-size='10.5' fill='#334155'>计算网　8 × OSFP 800G　单模 MPO　无损 RoCEv2</text>
<text x='872' y='730' font-size='10.5' fill='#334155'>存储网　2 × 200G　多模 MPO　无损 PFC + ECN</text>
<text x='872' y='748' font-size='10.5' fill='#334155'>带外网　1 × RJ45　铜缆　普通以太网，不需无损</text>
<text x='872' y='768' font-size='10.5' font-weight='600' fill='#9a3412'>三网故障域相互独立，单网故障不扩散</text>
<text x='872' y='782' font-size='10' fill='#64748b'>带外网不承载业务数据，无需 PFC / ECN 调优</text>
</svg>
