<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#0f172a">机房物理布局 — 一柜一台约束下的 block 划分</text>
  <text x="30" y="50" font-size="12" fill="#64748b">128 GPU 机柜（每柜 1 台 · 约 15.5 kW）+ 网络区 + 存储区 + 管理区 ≈ 140-150 柜</text>

  <rect x="40" y="76" width="330" height="180" rx="8" fill="#eafaf0" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Block A — 64 个 GPU 机柜</text>
  <text x="205" y="118" font-size="10.5" fill="#166534" text-anchor="middle">每柜 1 台 G894-ZD3-AAX7（8U）</text>

  <rect x="60" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="94" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="128" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="162" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="196" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="230" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="264" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="298" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="60" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="94" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="128" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="162" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="196" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="230" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="264" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="298" y="170" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="205" y="222" font-size="10.5" fill="#15803d" text-anchor="middle">示意：8 柜 × 8 排 ＝ 64 柜</text>
  <text x="205" y="242" font-size="10.5" font-weight="600" fill="#166534" text-anchor="middle">功耗约 1.0 MW</text>

  <rect x="390" y="76" width="160" height="180" rx="8" fill="#e6fbff" stroke="#0ea5b7" stroke-width="2"/>
  <text x="470" y="100" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">A 网络区</text>
  <text x="470" y="124" font-size="10.5" fill="#0e7490" text-anchor="middle">16 × SN5600 Leaf</text>
  <text x="470" y="142" font-size="10" fill="#0e7490" text-anchor="middle">平面1 ×8</text>
  <text x="470" y="158" font-size="10" fill="#0e7490" text-anchor="middle">平面2 ×8</text>
  <text x="470" y="182" font-size="10" fill="#334155" text-anchor="middle">2-3 个机柜</text>
  <text x="470" y="206" font-size="10" fill="#64748b" text-anchor="middle">每 leaf 收 1 rail</text>
  <text x="470" y="222" font-size="10" fill="#64748b" text-anchor="middle">× 64 节点</text>

  <rect x="570" y="76" width="150" height="180" rx="8" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="645" y="100" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">核心网络区</text>
  <text x="645" y="124" font-size="10.5" fill="#1d4ed8" text-anchor="middle">16 × SN5600 Spine</text>
  <text x="645" y="142" font-size="10" fill="#1d4ed8" text-anchor="middle">平面1 ×8 / 平面2 ×8</text>
  <text x="645" y="168" font-size="10" fill="#334155" text-anchor="middle">居中布置</text>
  <text x="645" y="186" font-size="10" fill="#334155" text-anchor="middle">缩短到两 block 距离</text>
  <text x="645" y="212" font-size="10" fill="#64748b" text-anchor="middle">2-3 个机柜</text>

  <rect x="740" y="76" width="160" height="180" rx="8" fill="#f3effc" stroke="#7c3aed" stroke-width="2"/>
  <text x="820" y="100" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">B 网络区</text>
  <text x="820" y="124" font-size="10.5" fill="#5b21b6" text-anchor="middle">16 × SN5600 Leaf</text>
  <text x="820" y="142" font-size="10" fill="#5b21b6" text-anchor="middle">平面1 ×8</text>
  <text x="820" y="158" font-size="10" fill="#5b21b6" text-anchor="middle">平面2 ×8</text>
  <text x="820" y="182" font-size="10" fill="#334155" text-anchor="middle">2-3 个机柜</text>

  <line x1="370" y1="166" x2="390" y2="166" stroke="#0ea5b7" stroke-width="2.5"/>
  <line x1="550" y1="166" x2="570" y2="166" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="720" y1="166" x2="740" y2="166" stroke="#1d4ed8" stroke-width="2.5"/>

  <rect x="40" y="286" width="330" height="150" rx="8" fill="#eafaf0" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="310" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Block B — 64 个 GPU 机柜</text>
  <text x="205" y="328" font-size="10.5" fill="#166534" text-anchor="middle">结构与 Block A 相同</text>
  <rect x="60" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="94" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="128" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="162" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="196" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="230" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="264" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="298" y="342" width="26" height="26" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="205" y="398" font-size="10.5" fill="#15803d" text-anchor="middle">8 柜 × 8 排 ＝ 64 柜</text>
  <text x="205" y="420" font-size="10.5" font-weight="600" fill="#166534" text-anchor="middle">功耗约 1.0 MW</text>

  <rect x="390" y="286" width="230" height="150" rx="8" fill="#e8effc" stroke="#2563eb" stroke-width="2"/>
  <text x="505" y="310" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">存储区</text>
  <text x="505" y="334" font-size="10.5" fill="#1d4ed8" text-anchor="middle">FusionServer 2158H V8</text>
  <text x="505" y="352" font-size="10" fill="#1d4ed8" text-anchor="middle">（数量待定 — 需按带宽核算）</text>
  <text x="505" y="376" font-size="10.5" fill="#1d4ed8" text-anchor="middle">4 × SN5600 Leaf</text>
  <text x="505" y="394" font-size="10.5" fill="#1d4ed8" text-anchor="middle">2 × SN4600 Spine</text>
  <text x="505" y="418" font-size="10" fill="#334155" text-anchor="middle">节点 2× BF-3 双归属接入</text>

  <rect x="640" y="286" width="260" height="150" rx="8" fill="#eef1f5" stroke="#475569" stroke-width="2"/>
  <text x="770" y="310" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">管理区</text>
  <text x="770" y="334" font-size="10.5" fill="#475569" text-anchor="middle">3 × K8s Master（etcd 独立 NVMe）</text>
  <text x="770" y="352" font-size="10.5" fill="#475569" text-anchor="middle">2 × 部署节点 · 2-4 × 登录节点</text>
  <text x="770" y="370" font-size="10.5" fill="#475569" text-anchor="middle">2 × 监控/仓库节点</text>
  <text x="770" y="394" font-size="10.5" fill="#475569" text-anchor="middle">8 × SN2201（每 16 柜 1 台）</text>
  <text x="770" y="418" font-size="10" fill="#334155" text-anchor="middle">2-3 个机柜</text>

  <rect x="40" y="460" width="860" height="72" rx="8" fill="#fff8ec" stroke="#ea7317" stroke-width="2"/>
  <text x="60" y="483" font-size="12" font-weight="700" fill="#9a3412">布线要点</text>
  <text x="60" y="503" font-size="10.5" fill="#7c2d12">rail-optimized 要求一台 leaf 收拢 64 个不同机柜的同号 GPU，因此 ToR 方案不可行，leaf 必须集中于网络区（EoR/MoR）。</text>
  <text x="60" y="521" font-size="10.5" fill="#7c2d12">block 内走线约 50-80 m，建议单模 2×DR4 光模块 + MPO 主干与配线架结构化布线；全网光纤链路约 2300 根。</text>
</svg>
