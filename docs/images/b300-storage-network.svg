<text x='205' y='258' font-size='10' fill='#7c2d12' text-anchor='middle'>承接直连存储 Server + 各类 Leaf 上行</text>
<rect x='360' y='216' width='290' height='58' rx='5' fill='#ffedd5' stroke='#9a3412' stroke-width='1.5'/>
<text x='505' y='238' font-size='11.5' font-weight='700' fill='#9a3412' text-anchor='middle'>G22 列 × 4</text>
<text x='505' y='258' font-size='10' fill='#7c2d12' text-anchor='middle'>承接直连存储 Server + 各类 Leaf 上行</text>
<rect x='660' y='216' width='290' height='58' rx='5' fill='#ffedd5' stroke='#9a3412' stroke-width='1.5'/>
<text x='805' y='238' font-size='11.5' font-weight='700' fill='#9a3412' text-anchor='middle'>F23 列 × 4</text>
<text x='805' y='258' font-size='10' fill='#7c2d12' text-anchor='middle'>承接直连存储 Server + 各类 Leaf 上行</text>
<rect x='960' y='216' width='290' height='58' rx='5' fill='#ffedd5' stroke='#9a3412' stroke-width='1.5'/>
<text x='1105' y='238' font-size='11.5' font-weight='700' fill='#9a3412' text-anchor='middle'>F22 列 × 4</text>
<text x='1105' y='258' font-size='10' fill='#7c2d12' text-anchor='middle'>承接直连存储 Server + 各类 Leaf 上行</text>

<rect x='30' y='302' width='1280' height='72' rx='7' fill='#f0fcff' stroke='#0ea5b7' stroke-width='2.2'/>
<text x='670' y='326' font-size='13' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf ↔ Spine 与 Spine ↔ Spine　全连接（full-mesh），负载分担</text>
<text x='670' y='347' font-size='11' fill='#334155' text-anchor='middle'>每一台 Leaf 与全部 16 台骨干 Spine 都有直连链路，不存在只连部分 Spine 的情况</text>
<text x='670' y='365' font-size='10.5' fill='#0e7490' text-anchor='middle'>存储 Server Leaf 4 + 计算节点存储 Leaf 8 + 管理 Leaf 2 = 14 台 Leaf　×　16 台 Spine　=　224 个连接对，任意 Leaf 对之间有 16 条等价路径</text>

<text x='34' y='404' font-size='13' font-weight='700' fill='#475569'>三类接入路径</text>
<line x1='160' y1='399' x2='1310' y2='399' stroke='#e2e8f0' stroke-width='1.5'/>
