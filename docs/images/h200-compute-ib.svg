<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1300 880' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1300' height='880' fill='#ffffff'/>
<rect x='0' y='0' width='1300' height='74' fill='#0e7490'/>
<text x='34' y='34' font-size='20' font-weight='700' fill='#ffffff'>H200 集群 · 计算网　InfiniBand NDR</text>
<text x='34' y='58' font-size='12.5' fill='#cffafe'>32 节点 / 256 GPU · Leaf 8（A03 列一柜）+ Spine 16（A01/A02/B01/B02 列）· Leaf↔Spine 与 Spine↔Spine 全连接，主备方式 · 链路层天然无损 · 收敛比 1:1</text>

<rect x='30' y='92' width='1240' height='58' rx='7' fill='#f0fcff' stroke='#0ea5b7' stroke-width='1.8'/>
<text x='46' y='113' font-size='12' font-weight='700' fill='#0e7490'>设备规格　NVIDIA MQM9790（Quantum-2 NDR）</text>
<text x='46' y='133' font-size='11' fill='#334155'>单台 32 × OSFP 800G 物理笼位 = 64 × 400G 端口能力，交换容量 51.2 Tb/s　·　Leaf 与 Spine 为同一型号，仅角色不同</text>

<text x='34' y='186' font-size='13' font-weight='700' fill='#475569'>Spine 层　16 台　（A01 / A02 / B01 / B02 列，每柜 U10 / U14 / U18 / U22）</text>
<line x1='170' y1='181' x2='1270' y2='181' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='34' y='200' width='292' height='64' rx='6' fill='#cffafe' stroke='#0e7490' stroke-width='1.6'/>
<text x='180' y='222' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>B01 列　Spine 1–4　U10/U14/U18/U22</text>
<text x='180' y='241' font-size='10.5' fill='#334155' text-anchor='middle'>下行 8 条（8 台 Leaf 各 1 条，灯亮）</text>
<text x='180' y='257' font-size='10' fill='#9a3412' text-anchor='middle'>实占 16 口，灯亮 8 → 另 8 口为 Spine 间备份</text>
