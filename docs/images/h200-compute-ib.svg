<text x='264' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='346' y='416' width='148' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
