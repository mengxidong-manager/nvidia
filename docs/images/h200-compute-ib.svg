<text x='484' y='241' font-size='10.5' fill='#334155' text-anchor='middle'>下行 8 条（8 台 Leaf 各 1 条，灯亮）</text>
<text x='484' y='257' font-size='10' fill='#9a3412' text-anchor='middle'>实占 16 口，灯亮 8 → 另 8 口为 Spine 间备份</text>
