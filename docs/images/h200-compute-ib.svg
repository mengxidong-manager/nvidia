<text x='420' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U18</text>
<text x='420' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='502' y='416' width='148' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='576' y='437' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf 4 · rail 3</text>
<text x='576' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U22</text>
<text x='576' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='658' y='416' width='148' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='732' y='437' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf 5 · rail 4</text>
<text x='732' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U26</text>
<text x='732' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='814' y='416' width='148' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='888' y='437' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf 6 · rail 5</text>
<text x='888' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U30</text>
<text x='888' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='970' y='416' width='148' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='1044' y='437' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf 7 · rail 6</text>
<text x='1044' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U34</text>
<text x='1044' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>
<rect x='1126' y='416' width='144' height='58' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='1198' y='437' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf 8 · rail 7</text>
<text x='1198' y='454' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>A03 列 U38</text>
<text x='1198' y='468' font-size='10' fill='#334155' text-anchor='middle'>16 下行 + 16 上行（32/32 满）</text>

<rect x='34' y='494' width='1236' height='44' rx='6' fill='#f0fdf4' stroke='#166534' stroke-width='1.8' stroke-dasharray='6 3'/>
<text x='652' y='512' font-size='11.5' font-weight='700' fill='#166534' text-anchor='middle'>节点 → Leaf　一卡一轨道</text>
<text x='652' y='530' font-size='10.5' fill='#334155' text-anchor='middle'>节点的第 i 号 GPU 的 400G 网卡固定接入 Leaf i+1；每笼位 800G 拆 2 × 400G 接两个节点</text>

<rect x='34' y='556' width='1236' height='84' rx='7' fill='#f6fdf8' stroke='#16a34a' stroke-width='2.2'/>
<rect x='34' y='556' width='1236' height='30' rx='7' fill='#16a34a'/>
<rect x='34' y='576' width='1236' height='10' fill='#16a34a'/>
<text x='50' y='577' font-size='12.5' font-weight='700' fill='#ffffff'>计算节点　32 台 Aivres KR6288 V2 · HGX H200 8-GPU · 256 GPU</text>
<rect x='50' y='596' width='596' height='34' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.4'/>
<text x='348' y='618' font-size='11.5' font-weight='600' fill='#166534' text-anchor='middle'>A 列　20 台 · 160 GPU</text>
<rect x='658' y='596' width='612' height='34' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.4'/>
<text x='964' y='618' font-size='11.5' font-weight='600' fill='#166534' text-anchor='middle'>B 列　12 台 · 96 GPU</text>

<rect x='34' y='660' width='404' height='192' rx='7' fill='#ffffff' stroke='#64748b' stroke-width='1.5'/>
<text x='48' y='682' font-size='12' font-weight='700' fill='#0f172a'>端口与容量账</text>
<text x='48' y='704' font-size='10.5' fill='#334155'>Leaf 下行　8 × 16 笼位 × 2 = 256 条 400G</text>
<text x='48' y='722' font-size='10.5' fill='#334155'>节点需求　32 × 8 张网卡 = 256 条</text>
<text x='48' y='740' font-size='10.5' font-weight='600' fill='#9a3412'>→ 完全匹配，无冗余下行端口</text>
<text x='48' y='764' font-size='10.5' fill='#334155'>Leaf 上行　8 × 16 = 128 条 800G</text>
<text x='48' y='782' font-size='10.5' fill='#334155'>Spine 入线　16 × 8 = 128 条（吻合）</text>
<text x='48' y='804' font-size='10.5' fill='#334155'>Leaf 笼位占用　16 + 16 = 32 / 32（满）</text>
<text x='48' y='822' font-size='10.5' fill='#334155'>Spine 端口占用　16 / 32（灯亮 8 + 备份 8）</text>
<text x='48' y='842' font-size='10' fill='#64748b'>扩容瓶颈在 Leaf（32/32 满）且受 A03 单柜 U 位限制</text>

<rect x='450' y='660' width='404' height='192' rx='7' fill='#ffffff' stroke='#0ea5b7' stroke-width='1.5'/>
<text x='464' y='682' font-size='12' font-weight='700' fill='#0e7490'>无损机制（InfiniBand）</text>
<text x='464' y='704' font-size='10.5' fill='#334155'>链路层 credit-based 流控：发送端只在</text>
<text x='464' y='720' font-size='10.5' fill='#334155'>收到对端 credit 后才发包，从机制上</text>
<text x='464' y='736' font-size='10.5' font-weight='600' fill='#166534'>不产生拥塞丢包 —— 天然无损</text>
<text x='464' y='760' font-size='10.5' fill='#334155'>无需 PFC / ECN / DCQCN 调优</text>
<text x='464' y='778' font-size='10.5' fill='#334155'>无需担心 PFC 死锁与反压扩散</text>
<text x='464' y='800' font-size='10.5' fill='#334155'>时延确定性好，抖动小</text>
<text x='464' y='820' font-size='10.5' fill='#334155'>由 Subnet Manager 统一下发路由</text>
<text x='464' y='842' font-size='10' fill='#64748b'>运维重点：SM 配置与 rail 亲和性，而非队列整定</text>

<rect x='866' y='660' width='404' height='192' rx='7' fill='#ffffff' stroke='#5b21b6' stroke-width='1.5'/>
<text x='880' y='682' font-size='12' font-weight='700' fill='#5b21b6'>全连接带来的通信特性</text>
<text x='880' y='704' font-size='10.5' fill='#334155'>同 rail 跨节点　Leaf 内交换，1 跳</text>
<text x='880' y='722' font-size='10.5' fill='#334155'>跨 rail 跨节点　Leaf → Spine → Leaf，3 跳</text>
<text x='880' y='740' font-size='10.5' fill='#334155'>节点内 8 卡　NVLink，0 跳</text>
<text x='880' y='764' font-size='10.5' fill='#334155'>主备方式：Leaf 对之间经 16 台 Spine 有 16 条路径，</text>
<text x='880' y='782' font-size='10.5' fill='#334155'>但同一时刻只有一组承载流量，另一组待命；</text>
<text x='880' y='798' font-size='10.5' font-weight='600' fill='#166534'>单台 Spine 故障由 SM 重算路由并切换</text>
<text x='880' y='822' font-size='10.5' fill='#334155'>32 节点全部在同一 rail 域内闭合</text>
<text x='880' y='842' font-size='10' fill='#64748b'>集合通信可在 Leaf 层完成，不必上 Spine</text>
</svg>
