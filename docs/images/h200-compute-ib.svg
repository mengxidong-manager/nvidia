<text x='788' y='241' font-size='10.5' fill='#334155' text-anchor='middle'>下行 8 条（8 台 Leaf 各 1 条，灯亮）</text>
<text x='788' y='257' font-size='10' fill='#9a3412' text-anchor='middle'>实占 16 口，灯亮 8 → 另 8 口为 Spine 间备份</text>
<rect x='946' y='200' width='324' height='64' rx='6' fill='#cffafe' stroke='#0e7490' stroke-width='1.6'/>
<text x='1108' y='222' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>A02 列　Spine 13–16　U10/U14/U18/U22</text>
<text x='1108' y='241' font-size='10.5' fill='#334155' text-anchor='middle'>下行 8 条（8 台 Leaf 各 1 条，灯亮）</text>
<text x='1108' y='257' font-size='10' fill='#9a3412' text-anchor='middle'>实占 16 口，灯亮 8 → 另 8 口为 Spine 间备份</text>

<rect x='34' y='284' width='1236' height='88' rx='7' fill='#fff8ec' stroke='#ea7317' stroke-width='2.2'/>
<text x='652' y='308' font-size='13.5' font-weight='700' fill='#9a3412' text-anchor='middle'>Leaf ↔ Spine 与 Spine ↔ Spine　全连接（full-mesh），主备方式</text>
<text x='652' y='330' font-size='11.5' fill='#7c2d12' text-anchor='middle'>每一台 Leaf 与每一台 Spine 之间都有直连链路；Spine 之间同样全连接，但处于备份状态（端口灯不亮）</text>
<text x='652' y='350' font-size='11' fill='#334155' text-anchor='middle'>8 台 Leaf × 16 台 Spine = 128 个连接对　·　每对 1 条 800G　·　合计 128 条 800G</text>
<text x='652' y='366' font-size='10.5' fill='#9a3412' text-anchor='middle'>每台 Leaf 上行 16 条（对应 16 台 Spine）　·　每台 Spine 下行 8 条（灯亮）+ 横向 8 口（备份，灯不亮）→ 实占 16 / 32</text>

<text x='34' y='404' font-size='13' font-weight='700' fill='#475569'>Leaf 层　8 台　全部位于 A03 列一个机柜：U10 / U14 / U18 / U22 / U26 / U30 / U34 / U38　（一台 Leaf = 一条 rail）</text>
<line x1='300' y1='399' x2='1270' y2='399' stroke='#e2e8f0' stroke-width='1.5'/>

