<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1340 900' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1340' height='900' fill='#ffffff'/>
<rect x='0' y='0' width='1340' height='74' fill='#5b21b6'/>
<text x='34' y='34' font-size='20' font-weight='700' fill='#ffffff'>H200 集群 · 存储网　DDN A³I + NVIDIA Spectrum 以太网</text>
<text x='34' y='58' font-size='12.5' fill='#ddd6fe'>DDN 并行文件系统（EXAScaler / Lustre）· 8 台 Spectrum 交换机自成三层 · 与 B300 的存储体系完全无关 · C 列在 U37、D 列的 Leaf 与 Spine 在 U31</text>

<rect x='30' y='92' width='1280' height='58' rx='7' fill='#fef2f2' stroke='#9a3412' stroke-width='2'/>
<text x='46' y='113' font-size='12' font-weight='700' fill='#9a3412'>边界声明</text>
<text x='46' y='133' font-size='11' fill='#334155'>H200 的存储不使用 B300 的存储网骨干（16 台 H3C S9825），也不使用任何 H3C S9825 存储 Leaf。本集群存储为独立的 DDN 系统 + NVIDIA Spectrum 以太网，从存储设备到 Core 全部自有，与 B300 的 130 台存储节点无任何连接。</text>

<rect x='380' y='172' width='580' height='56' rx='7' fill='#ede9fe' stroke='#5b21b6' stroke-width='2.4'/>
<text x='670' y='195' font-size='13' font-weight='700' fill='#0f172a' text-anchor='middle'>Core　NVIDIA SN4600 × 2</text>
<text x='670' y='216' font-size='10.5' fill='#5b21b6' text-anchor='middle'>C22 列 U10 / D22 列 U10　·　H200 自有存储网核心　→　上行机房出口路由器 CR16005E ×2（C22/D22 U13）</text>
<line x1='670' y1='228' x2='670' y2='256' stroke='#7c3aed' stroke-width='2.6'/>
<path d='M 664 238 L 670 226 L 676 238 Z' fill='#7c3aed'/>

<rect x='380' y='258' width='580' height='56' rx='7' fill='#f3effc' stroke='#5b21b6' stroke-width='2.2'/>
<text x='670' y='281' font-size='13' font-weight='700' fill='#5b21b6' text-anchor='middle'>Spine　NVIDIA SN5600 × 2</text>
<text x='670' y='302' font-size='10.5' fill='#334155' text-anchor='middle'>C22 列 U37 / D22 列 U31　·　两组 Leaf 共用这一对 Spine（注意 D 列为 U31）</text>

<rect x='120' y='340' width='1100' height='58' rx='6' fill='#fff8ec' stroke='#ea7317' stroke-width='2'/>
<text x='670' y='362' font-size='12.5' font-weight='700' fill='#9a3412' text-anchor='middle'>Leaf ↔ Spine　全连接（full-mesh）</text>
<text x='670' y='383' font-size='11' fill='#334155' text-anchor='middle'>4 台 Leaf × 2 台 Spine = 8 个连接对，每台 Leaf 双上行分接两台 Spine；Spine 再双上行至两台 Core　→　每一层双机冗余，无单点</text>

<line x1='300' y1='398' x2='300' y2='428' stroke='#7c3aed' stroke-width='2.4'/>
<path d='M 294 418 L 300 430 L 306 418 Z' fill='#7c3aed'/>
<line x1='1040' y1='398' x2='1040' y2='428' stroke='#7c3aed' stroke-width='2.4'/>
<path d='M 1034 418 L 1040 430 L 1046 418 Z' fill='#7c3aed'/>

<rect x='40' y='430' width='580' height='104' rx='7' fill='#f0fdf4' stroke='#166534' stroke-width='2.2'/>
<text x='330' y='454' font-size='12.5' font-weight='700' fill='#166534' text-anchor='middle'>DDN 存储接入 Leaf　NVIDIA SN5600 × 2</text>
<rect x='56' y='466' width='272' height='30' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.3'/>
<text x='192' y='486' font-size='11' font-weight='600' fill='#166534' text-anchor='middle'>C21 列 U37</text>
<rect x='336' y='466' width='272' height='30' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.3'/>
<text x='472' y='486' font-size='11' font-weight='600' fill='#166534' text-anchor='middle'>D21 列 U37</text>
<text x='330' y='515' font-size='10.5' fill='#334155' text-anchor='middle'>DDN 存储控制器双归属接入，分接两台 Leaf</text>
<text x='330' y='529' font-size='10' fill='#64748b' text-anchor='middle'>原台账中记为「管理 Server Leaf」，实际承载 DDN 存储接入</text>

<rect x='720' y='430' width='580' height='104' rx='7' fill='#f0fcff' stroke='#0ea5b7' stroke-width='2.2'/>
<text x='1010' y='454' font-size='12.5' font-weight='700' fill='#0e7490' text-anchor='middle'>计算节点存储接入 Leaf　NVIDIA SN5600 × 2</text>
<rect x='736' y='466' width='272' height='30' rx='4' fill='#cffafe' stroke='#0e7490' stroke-width='1.3'/>
<text x='872' y='486' font-size='11' font-weight='600' fill='#0e7490' text-anchor='middle'>C23 列 U37</text>
<rect x='1016' y='466' width='272' height='30' rx='4' fill='#cffafe' stroke='#0e7490' stroke-width='1.3'/>
<text x='1152' y='486' font-size='11' font-weight='600' fill='#9a3412' text-anchor='middle'>D23 列 U31</text>
<text x='1010' y='515' font-size='10.5' fill='#334155' text-anchor='middle'>32 台计算节点双归属接入，分接两台 Leaf</text>
<text x='1010' y='529' font-size='10' fill='#64748b' text-anchor='middle'>承载训练数据读取与 Checkpoint 读写</text>

<line x1='330' y1='534' x2='330' y2='566' stroke='#166534' stroke-width='2.4'/>
<path d='M 324 556 L 330 568 L 336 556 Z' fill='#166534'/>
<line x1='1010' y1='534' x2='1010' y2='566' stroke='#0ea5b7' stroke-width='2.4'/>
<path d='M 1004 556 L 1010 568 L 1016 556 Z' fill='#0ea5b7'/>

<rect x='40' y='568' width='580' height='110' rx='7' fill='#ffffff' stroke='#166534' stroke-width='2.2'/>
<text x='330' y='592' font-size='13' font-weight='700' fill='#166534' text-anchor='middle'>DDN 存储系统　A³I 系列一体机</text>
<text x='54' y='614' font-size='10.5' fill='#334155'>文件系统　DDN EXAScaler（基于 Lustre 的并行文件系统）</text>
<text x='54' y='632' font-size='10.5' fill='#334155'>形态　2RU 全 NVMe 一体机，单机 250TB / 500TB 可选</text>
<text x='54' y='650' font-size='10.5' fill='#334155'>接口　每台 8 个数据口，支持 IB NDR 200G / 以太网 / RoCE</text>
<text x='54' y='668' font-size='10' font-weight='600' fill='#9a3412'>型号与台数待补（见下方容量规划基准）</text>

<rect x='720' y='568' width='580' height='110' rx='7' fill='#f6fdf8' stroke='#16a34a' stroke-width='2.2'/>
<text x='1010' y='592' font-size='13' font-weight='700' fill='#166534' text-anchor='middle'>H200 计算节点 × 32　·　256 GPU</text>
<text x='734' y='614' font-size='10.5' fill='#334155'>Aivres KR6288 V2 · HGX H200 8-GPU　·　A 列 20 台 + B 列 12 台</text>
<text x='734' y='632' font-size='10.5' fill='#334155'>存储网口与 IB 计算网卡（8 × 400G）完全分离，互不复用</text>
<text x='734' y='650' font-size='10.5' fill='#334155'>DDN 客户端支持容器直连与 Hot Nodes 本地 NVMe 只读缓存</text>
<text x='734' y='668' font-size='10' fill='#15803d'>支持 GPUDirect Storage，数据绕过 CPU 内存直达 GPU 显存</text>

<text x='34' y='712' font-size='13' font-weight='700' fill='#475569'>DDN A³I 规格与容量规划</text>
<line x1='230' y1='707' x2='1310' y2='707' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='30' y='724' width='420' height='160' rx='7' fill='#ffffff' stroke='#166534' stroke-width='1.6'/>
<text x='44' y='746' font-size='12' font-weight='700' fill='#166534'>单机规格（DDN 官方参考架构）</text>
<text x='44' y='768' font-size='10.5' fill='#334155'>AI400X2　读 &gt; 90 GB/s　·　写 &gt; 90 GB/s　·　3M IOPS</text>
<text x='44' y='786' font-size='10.5' fill='#334155'>AI400X2 Turbo　读 ≤ 115 GB/s　·　写 ≤ 75 GB/s　·　3M IOPS</text>
<text x='44' y='806' font-size='10.5' fill='#334155'>形态　2RU 全 NVMe　·　容量 250TB / 500TB</text>
<text x='44' y='824' font-size='10.5' fill='#334155'>数据口　8 × 200Gb NDR IB（亦支持以太网 / RoCE）</text>
<text x='44' y='842' font-size='10.5' fill='#334155'>管理口　独立 M 口 + BMC B 口 + 控制器互联 I 口</text>
<text x='44' y='862' font-size='10' fill='#64748b'>整机柜可堆叠至读 2.4 TB/s、写 1.6 TB/s（Turbo）</text>
<text x='44' y='878' font-size='10' fill='#64748b'>性能随一体机数量线性扩展</text>

<rect x='464' y='724' width='420' height='160' rx='7' fill='#ffffff' stroke='#9a3412' stroke-width='1.6'/>
<text x='478' y='746' font-size='12' font-weight='700' fill='#9a3412'>容量规划基准（NVIDIA / DDN 建议）</text>
<text x='478' y='770' font-size='11' fill='#334155'>建议值　每颗 H100 / H200 GPU 至少</text>
<text x='478' y='788' font-size='12' font-weight='700' fill='#9a3412'>1 GB/s 读 + 1 GB/s 写</text>
<text x='478' y='810' font-size='11' fill='#334155'>本集群需求　256 GPU × 1 GB/s =</text>
<text x='478' y='828' font-size='12' font-weight='700' fill='#166534'>≥ 256 GB/s 读写吞吐</text>
<text x='478' y='850' font-size='10.5' fill='#334155'>按 AI400X2 单机 &gt; 90 GB/s 折算：</text>
<text x='478' y='868' font-size='11' font-weight='700' fill='#9a3412'>至少 3 台一体机方可满足</text>
<text x='478' y='882' font-size='10' fill='#64748b'>实际台数需按现网核实后填入</text>

<rect x='898' y='724' width='412' height='160' rx='7' fill='#ffffff' stroke='#5b21b6' stroke-width='1.6'/>
<text x='912' y='746' font-size='12' font-weight='700' fill='#5b21b6'>数据路径与无损</text>
<text x='912' y='768' font-size='10.5' fill='#334155'>节点 → C23U37/D23U31 → Spine C22U37/D22U31 → C21/D21 U37 → DDN</text>
<text x='912' y='786' font-size='10.5' font-weight='600' fill='#166534'>3 跳，全程在 H200 自有 Spectrum 体系内</text>
<text x='912' y='808' font-size='10.5' fill='#334155'>· 存储流量启用 PFC + ECN 构建无损队列</text>
<text x='912' y='826' font-size='10.5' fill='#334155'>· 全连接 + 双上行提供等价多路径</text>
<text x='912' y='844' font-size='10.5' fill='#334155'>· Spectrum 支持 RoCE 加速与端到端遥测</text>
<text x='912' y='862' font-size='10.5' fill='#334155'>· DDN 客户端 NUMA 感知，线程绑核就近 I/O</text>
<text x='912' y='878' font-size='10' fill='#64748b'>与 IB 计算网、带外管理网三者物理隔离</text>
</svg>
