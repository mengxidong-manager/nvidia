<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 1000' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1400' height='1000' fill='#ffffff'/>
<rect x='0' y='0' width='1400' height='78' fill='#0f172a'/>
<text x='36' y='36' font-size='21' font-weight='700' fill='#ffffff'>H200 集群 — 三套独立网络体系详图</text>
<text x='36' y='62' font-size='12.5' fill='#94a3b8'>32 节点 · 256 GPU · 交换机 36 台 · IB 计算网 + H3C 存储网 + NVIDIA Spectrum 管理体系，三者相互独立</text>

<rect x='30' y='96' width='1340' height='52' rx='7' fill='#f8fafc' stroke='#1f2937' stroke-width='1.6'/>
<text x='46' y='118' font-size='12' font-weight='700' fill='#0f172a'>体系特征</text>
<text x='46' y='137' font-size='11' fill='#334155'>H200 建设在前，采用 NVIDIA 全栈；计算网为 InfiniBand NDR（链路层天然无损，无需 PFC/ECN 调优），存储与管理走独立的 Spectrum 以太网体系，仅存储 Server 一路并入共享 H3C 骨干。</text>

