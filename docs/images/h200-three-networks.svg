<text x='1179' y='626' font-size='11.5' font-weight='700' fill='#1d4ed8' text-anchor='middle'>全机房 IPMI 核心</text>
<text x='1179' y='645' font-size='10' fill='#334155' text-anchor='middle'>S9825 × 2 · C22/D22 U17</text>
<text x='1179' y='661' font-size='10' font-weight='600' fill='#9a3412' text-anchor='middle'>两集群共用 → 出口路由器</text>

