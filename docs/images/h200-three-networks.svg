<text x='48' y='723' font-size='12.5' font-weight='700' fill='#ffffff'>计算节点　32 台 Aivres KR6288 V2 · HGX H200 · 256 GPU</text>
<rect x='48' y='742' width='296' height='30' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.3'/>
<text x='196' y='762' font-size='11' font-weight='600' fill='#166534' text-anchor='middle'>A 列　20 台 · 160 GPU</text>
<rect x='352' y='742' width='290' height='30' rx='4' fill='#dcfce7' stroke='#166534' stroke-width='1.3'/>
<text x='497' y='762' font-size='11' font-weight='600' fill='#166534' text-anchor='middle'>B 列　12 台 · 96 GPU</text>
<text x='48' y='792' font-size='10.5' fill='#334155'>单节点出口　计算网 8 × 400G（一卡一轨道，3.2 Tbps）　+　存储网口　+　1 × RJ45 IPMI</text>

<rect x='680' y='702' width='630' height='106' rx='8' fill='#ffffff' stroke='#1f2937' stroke-width='2'/>
<text x='696' y='724' font-size='12.5' font-weight='700' fill='#0f172a'>交换机台账　33 台</text>
<text x='696' y='746' font-size='10.5' fill='#334155'>计算网　MQM9790 × 24（Leaf 8 + Spine 16）</text>
<text x='696' y='764' font-size='10.5' fill='#334155'>存储网　SN5600 × 6（DDN 接入 2 + 计算节点 2 + Spine 2）+ SN4600 × 2 核心</text>
<text x='696' y='782' font-size='10.5' font-weight='600' fill='#9a3412'>带外管理　H3C S5590 × 1（C22 列 U33）</text>
<text x='696' y='800' font-size='10' fill='#64748b'>除这 1 台 S5590 外均为 NVIDIA 设备；全机房 IPMI 核心与出口路由器为共用，不计入本表</text>

<rect x='30' y='824' width='1280' height='96' rx='8' fill='#f8fafc' stroke='#1f2937' stroke-width='1.8'/>
<text x='46' y='846' font-size='12.5' font-weight='700' fill='#0f172a'>三张网对照</text>
<text x='46' y='868' font-size='11' fill='#334155'>计算网　8 × 400G IB NDR　·　MQM9790 × 24　·　链路层 credit 流控天然无损　·　Spine 主备全连接　·　承载 GPU 集合通信</text>
<text x='46' y='888' font-size='11' fill='#334155'>存储网　DDN A³I（EXAScaler / Lustre）+ SN5600 × 6 / SN4600 × 2　·　PFC + ECN 无损队列　·　承载训练数据与 Checkpoint</text>
<text x='46' y='908' font-size='11' fill='#334155'>带外网　1 × RJ45 铜缆　·　自有接入 C22U33 → IPMI Spine S6805 → 全机房 IPMI 核心 S9825（C22/D22 U17）→ 出口路由器　·　普通以太网，不需无损</text>
