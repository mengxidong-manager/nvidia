<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1340 940' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1340' height='940' fill='#ffffff'/>
<rect x='0' y='0' width='1340' height='74' fill='#0f172a'/>
<text x='34' y='34' font-size='20' font-weight='700' fill='#ffffff'>H200 集群 — 三张网汇总</text>
<text x='34' y='58' font-size='12.5' fill='#94a3b8'>32 节点 / 256 GPU · 专属交换机 33 台 · 计算网 IB NDR + 存储网 DDN/Spectrum + 带外管理网（与 B300 统一的一张网）</text>

<rect x='30' y='92' width='1280' height='56' rx='7' fill='#fef2f2' stroke='#9a3412' stroke-width='2'/>
<text x='46' y='113' font-size='12' font-weight='700' fill='#9a3412'>与 B300 的关系</text>
<text x='46' y='133' font-size='11' fill='#334155'>计算网与存储网完全自有，与 B300 的存储网骨干（16 台 H3C S9825）及 130 台存储节点无任何连接，也不使用 H3C S9825 存储 Leaf。带外管理为两集群统一的一张网：H200 自有 IPMI 接入交换机（C22 列 U33，归属 H200），上行全机房 IPMI 核心 C22/D22 U17。</text>

<rect x='30' y='164' width='630' height='376' rx='9' fill='#f0fcff' stroke='#0ea5b7' stroke-width='2.4'/>
<rect x='30' y='164' width='630' height='32' rx='9' fill='#0ea5b7'/>
<rect x='30' y='186' width='630' height='10' fill='#0ea5b7'/>
<text x='48' y='186' font-size='13' font-weight='700' fill='#ffffff'>① 计算网　InfiniBand NDR　（East-West）</text>

<rect x='48' y='208' width='594' height='56' rx='5' fill='#cffafe' stroke='#0e7490' stroke-width='1.6'/>
<text x='345' y='229' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>Spine　NVIDIA MQM9790 × 16</text>
<text x='345' y='249' font-size='10.5' fill='#334155' text-anchor='middle'>A01 / A02 / B01 / B02 列各 4 台，每柜 U10/U14/U18/U22</text>
<text x='345' y='261' font-size='10' fill='#9a3412' text-anchor='middle'>实占 16 / 32 端口，灯亮 8（下行 Leaf）+ 备份 8（Spine 间）</text>

<rect x='48' y='276' width='594' height='44' rx='5' fill='#fff8ec' stroke='#ea7317' stroke-width='1.5' stroke-dasharray='6 3'/>
<text x='345' y='295' font-size='11' font-weight='700' fill='#9a3412' text-anchor='middle'>Leaf ↔ Spine 与 Spine ↔ Spine 全连接，主备方式　8 × 16 = 128 个连接对</text>
<text x='345' y='312' font-size='10' fill='#7c2d12' text-anchor='middle'>经 16 台 Spine 有 16 条路径，但同一时刻只有一组承载流量，故障由 SM 重算路由切换</text>

<rect x='48' y='332' width='594' height='56' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.6'/>
<text x='345' y='353' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>Leaf　NVIDIA MQM9790 × 8　（A03 列一柜，一台 Leaf = 一条 rail）</text>
<text x='345' y='372' font-size='10.5' fill='#334155' text-anchor='middle'>U10/U14/U18/U22/U26/U30/U34/U38　·　16 下行 + 16 上行 = 32 / 32 全满</text>
<text x='345' y='384' font-size='10' fill='#0e7490' text-anchor='middle'>下行 12.8 Tb/s 与上行 12.8 Tb/s 对等，收敛比 1:1</text>

<rect x='48' y='400' width='594' height='60' rx='5' fill='#ffffff' stroke='#64748b' stroke-width='1.4'/>
<text x='62' y='420' font-size='11' font-weight='700' fill='#0f172a'>容量校验</text>
<text x='62' y='438' font-size='10.5' fill='#334155'>下行 8 × 16 × 2 = 256 条 400G　=　节点需求 32 × 8 张网卡</text>
<text x='62' y='454' font-size='10.5' font-weight='600' fill='#9a3412'>完全匹配，无冗余下行端口；扩容须整台加 Leaf</text>

<rect x='48' y='472' width='594' height='54' rx='5' fill='#ffffff' stroke='#0ea5b7' stroke-width='1.4'/>
<text x='62' y='492' font-size='11' font-weight='700' fill='#0e7490'>无损机制</text>
<text x='62' y='510' font-size='10.5' fill='#334155'>链路层 credit-based 流控，机制上不产生拥塞丢包 —— 天然无损</text>
<text x='62' y='522' font-size='10' fill='#64748b'>无需 PFC / ECN / DCQCN 调优，无 PFC 死锁风险；由 Subnet Manager 下发路由</text>

<rect x='680' y='164' width='630' height='376' rx='9' fill='#f0fdf4' stroke='#166534' stroke-width='2.4'/>
<rect x='680' y='164' width='630' height='32' rx='9' fill='#166534'/>
<rect x='680' y='186' width='630' height='10' fill='#166534'/>
<text x='698' y='186' font-size='13' font-weight='700' fill='#ffffff'>② 存储网　DDN A³I + NVIDIA Spectrum　（North-South）</text>

<rect x='698' y='208' width='594' height='44' rx='5' fill='#ede9fe' stroke='#5b21b6' stroke-width='1.6'/>
<text x='995' y='228' font-size='12' font-weight='700' fill='#5b21b6' text-anchor='middle'>Core　NVIDIA SN4600 × 2</text>
<text x='995' y='245' font-size='10' fill='#334155' text-anchor='middle'>C22 列 U10 / D22 列 U10　·　存储网核心，上行出口路由器</text>

<rect x='698' y='262' width='594' height='44' rx='5' fill='#f3effc' stroke='#5b21b6' stroke-width='1.6'/>
<text x='995' y='282' font-size='12' font-weight='700' fill='#5b21b6' text-anchor='middle'>Spine　NVIDIA SN5600 × 2</text>
<text x='995' y='299' font-size='10' fill='#334155' text-anchor='middle'>C22 列 U37 / D22 列 U31　·　两组 Leaf 共用</text>

<rect x='698' y='316' width='290' height='66' rx='5' fill='#dcfce7' stroke='#166534' stroke-width='1.6'/>
<text x='843' y='336' font-size='11.5' font-weight='700' fill='#166534' text-anchor='middle'>DDN 存储接入 Leaf　SN5600 × 2</text>
<text x='843' y='354' font-size='10' fill='#334155' text-anchor='middle'>C21 列 U37　/　D21 列 U37</text>
<text x='843' y='372' font-size='10' fill='#64748b' text-anchor='middle'>原记为「管理 Server Leaf」</text>

<rect x='1002' y='316' width='290' height='66' rx='5' fill='#cffafe' stroke='#0e7490' stroke-width='1.6'/>
<text x='1147' y='336' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>计算节点存储 Leaf　SN5600 × 2</text>
<text x='1147' y='354' font-size='10' fill='#334155' text-anchor='middle'>C23 列 U37　/　D23 列 U31</text>
<text x='1147' y='372' font-size='10' fill='#64748b' text-anchor='middle'>32 台节点双归属接入</text>

<rect x='698' y='392' width='290' height='68' rx='5' fill='#ffffff' stroke='#166534' stroke-width='1.6'/>
<text x='843' y='412' font-size='11.5' font-weight='700' fill='#166534' text-anchor='middle'>DDN 存储系统</text>
<text x='843' y='430' font-size='10' fill='#334155' text-anchor='middle'>EXAScaler 并行文件系统（基于 Lustre）</text>
<text x='843' y='446' font-size='10' fill='#334155' text-anchor='middle'>2RU 全 NVMe 一体机 · 8 × 200Gb 数据口</text>
<text x='843' y='458' font-size='9.5' fill='#9a3412' text-anchor='middle'>型号与台数待补</text>

<rect x='1002' y='392' width='290' height='68' rx='5' fill='#ffffff' stroke='#0e7490' stroke-width='1.6'/>
<text x='1147' y='412' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>数据路径</text>
<text x='1147' y='430' font-size='10' fill='#334155' text-anchor='middle'>节点 → C23U37 / D23U31 → Spine</text>
<text x='1147' y='446' font-size='10' fill='#334155' text-anchor='middle'>→ C21/D21 U37 → DDN　（3 跳）</text>
<text x='1147' y='458' font-size='9.5' fill='#166534' text-anchor='middle'>支持 GPUDirect Storage</text>

<rect x='698' y='472' width='594' height='54' rx='5' fill='#ffffff' stroke='#9a3412' stroke-width='1.4'/>
<text x='712' y='492' font-size='11' font-weight='700' fill='#9a3412'>容量规划基准</text>
<text x='712' y='510' font-size='10.5' fill='#334155'>NVIDIA / DDN 建议每颗 H100/H200 GPU ≥ 1 GB/s 读 + 1 GB/s 写</text>
<text x='712' y='522' font-size='10' font-weight='600' fill='#166534'>256 GPU → ≥ 256 GB/s；按 AI400X2 单机 &gt; 90 GB/s 折算，至少 3 台</text>

<text x='34' y='576' font-size='13' font-weight='700' fill='#475569'>③ 带外管理网（OOB / IPMI）　与 B300 统一的一张网</text>
<line x1='400' y1='571' x2='1310' y2='571' stroke='#e2e8f0' stroke-width='1.5'/>

