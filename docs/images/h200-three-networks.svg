<text x='881' y='645' font-size='10' fill='#334155' text-anchor='middle'>H3C S6805 · C22/D22 列 U40</text>
<text x='881' y='661' font-size='10' fill='#64748b' text-anchor='middle'>双上行，任一故障不失管</text>
<line x1='1016' y1='638' x2='1068' y2='638' stroke='#7c3aed' stroke-width='2.4'/>
<path d='M 1060 633 L 1070 638 L 1060 643 Z' fill='#7c3aed'/>
