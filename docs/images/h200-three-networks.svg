<text x='62' y='432' font-size='11.5' font-weight='700' fill='#0f172a'>下行容量校验（无任何冗余端口）</text>
<text x='62' y='454' font-size='10.5' fill='#334155'>下行能力 = 8 台 × 16 口 × 2（800G 拆 2×400G）= 256 条 400G</text>
<text x='62' y='472' font-size='10.5' fill='#334155'>节点需求 = 32 节点 × 8 张网卡 = 256 条 400G</text>
<text x='62' y='494' font-size='11' font-weight='700' fill='#9a3412'>→ 完全相等，没有任何余量；新增 H200 节点必须先扩 Leaf</text>

