<text x='199' y='644' font-size='10' fill='#334155' text-anchor='middle'>每节点 1 × RJ45 专用 IPMI 口</text>
<text x='199' y='660' font-size='10' fill='#64748b' text-anchor='middle'>与 IB 网卡、存储网口物理分离</text>
