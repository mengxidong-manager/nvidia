<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>

  <!-- ===== 标题带 ===== -->
  <rect x="0" y="0" width="1280" height="86" fill="url(#hdr)"/>
  <text x="40" y="40" font-size="23" font-weight="700" fill="#ffffff">S110 智算中心 — 整体网络架构</text>
  <text x="40" y="68" font-size="13" fill="#94a3b8">H200 与 B300 双训练集群 · 三张网分层 · 共享存储骨干</text>

  <!-- ===== KPI 行 ===== -->
  <rect x="40" y="110" width="222" height="76" rx="8" fill="#eafaf0" stroke="#16a34a" stroke-width="2"/>
  <text x="151" y="145" font-size="27" font-weight="700" fill="#166534" text-anchor="middle">1,272</text>
  <text x="151" y="169" font-size="11.5" fill="#166534" text-anchor="middle">GPU 总数</text>

  <rect x="278" y="110" width="222" height="76" rx="8" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="389" y="145" font-size="27" font-weight="700" fill="#1d4ed8" text-anchor="middle">159</text>
  <text x="389" y="169" font-size="11.5" fill="#1d4ed8" text-anchor="middle">GPU 计算节点</text>

  <rect x="516" y="110" width="222" height="76" rx="8" fill="#e6fbff" stroke="#0ea5b7" stroke-width="2"/>
  <text x="627" y="145" font-size="27" font-weight="700" fill="#0e7490" text-anchor="middle">130</text>
  <text x="627" y="169" font-size="11.5" fill="#0e7490" text-anchor="middle">存储节点</text>

  <rect x="754" y="110" width="222" height="76" rx="8" fill="#f3effc" stroke="#7c3aed" stroke-width="2"/>
  <text x="865" y="145" font-size="27" font-weight="700" fill="#5b21b6" text-anchor="middle">123</text>
  <text x="865" y="169" font-size="11.5" fill="#5b21b6" text-anchor="middle">网络交换机</text>

  <rect x="992" y="110" width="248" height="76" rx="8" fill="#fff8ec" stroke="#ea7317" stroke-width="2"/>
  <text x="1116" y="145" font-size="27" font-weight="700" fill="#9a3412" text-anchor="middle">~3.2 MW</text>
  <text x="1116" y="169" font-size="11.5" fill="#9a3412" text-anchor="middle">设施总功率（含制冷）</text>

  <!-- ===== 第一层：核心 ===== -->
  <text x="40" y="224" font-size="13.5" font-weight="700" fill="#475569">核心层</text>
  <line x1="100" y1="219" x2="1240" y2="219" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="200" y="236" width="380" height="62" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.2"/>
  <text x="390" y="261" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">H200 核心交换</text>
  <text x="390" y="282" font-size="11" fill="#5b21b6" text-anchor="middle">NVIDIA SN4600 × 2　冗余部署</text>

  <rect x="700" y="236" width="380" height="62" rx="8" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="890" y="261" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">B300 业务网核心</text>
  <text x="890" y="282" font-size="11" fill="#1d4ed8" text-anchor="middle">H3C S9825 × 2　冗余部署</text>

  <!-- ===== 第二层：共享存储骨干 ===== -->
  <text x="40" y="344" font-size="13.5" font-weight="700" fill="#475569">共享骨干</text>
  <line x1="118" y1="339" x2="1240" y2="339" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="200" y="356" width="880" height="72" rx="8" fill="#fff8ec" stroke="#ea7317" stroke-width="2.5"/>
  <text x="640" y="382" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">存储网 Spine × 16　H3C S9825　（双集群共享）</text>
  <text x="640" y="405" font-size="11" fill="#7c2d12" text-anchor="middle">统一承载两套集群的存储流量　·　四列分布部署，横向无阻塞</text>
  <text x="640" y="421" font-size="10.5" fill="#9a3412" text-anchor="middle">资源池化：一套存储骨干服务全部 159 个计算节点</text>

  <line x1="890" y1="298" x2="890" y2="356" stroke="#ea7317" stroke-width="2.5"/>
  <path d="M 886 304 L 890 296 L 894 304 Z" fill="#ea7317"/>

  <!-- ===== 第三层：两个集群 ===== -->
  <text x="40" y="474" font-size="13.5" font-weight="700" fill="#475569">集群层</text>
  <line x1="100" y1="469" x2="1240" y2="469" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- H200 -->
  <rect x="40" y="488" width="580" height="248" rx="9" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="40" y="488" width="580" height="38" rx="9" fill="#2563eb"/>
  <rect x="40" y="516" width="580" height="10" fill="#2563eb"/>
  <text x="62" y="514" font-size="15" font-weight="700" fill="#ffffff">H200 训练集群</text>
  <text x="598" y="514" font-size="12.5" font-weight="700" fill="#bfdbfe" text-anchor="end">32 节点 · 256 GPU</text>

  <rect x="60" y="540" width="268" height="86" rx="6" fill="#e6fbff" stroke="#0ea5b7" stroke-width="1.8"/>
  <text x="194" y="562" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">计算网络</text>
  <text x="194" y="582" font-size="10.5" fill="#334155" text-anchor="middle">InfiniBand NDR</text>
  <text x="194" y="600" font-size="10.5" fill="#334155" text-anchor="middle">NVIDIA MQM9790 × 24</text>
  <text x="194" y="617" font-size="10" fill="#0e7490" text-anchor="middle">8 Leaf + 16 Spine · 轨道优化</text>

  <rect x="344" y="540" width="258" height="86" rx="6" fill="#e8effc" stroke="#2563eb" stroke-width="1.8"/>
  <text x="473" y="562" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">存储与管理</text>
  <text x="473" y="582" font-size="10.5" fill="#334155" text-anchor="middle">存储节点 66 台</text>
  <text x="473" y="600" font-size="10.5" fill="#334155" text-anchor="middle">NVIDIA SN5600 / SN4600</text>
  <text x="473" y="617" font-size="10" fill="#1d4ed8" text-anchor="middle">独立存储与管理平面</text>

  <rect x="60" y="640" width="542" height="76" rx="6" fill="#eafaf0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="331" y="662" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">计算节点　Aivres KR6288 · HGX H200 8-GPU</text>
  <text x="331" y="682" font-size="10.5" fill="#166534" text-anchor="middle">每节点 8 × 400G 计算网卡，一卡一轨道</text>
  <text x="331" y="702" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">节点间互联带宽 3.2 Tbps</text>

  <!-- B300 -->
  <rect x="660" y="488" width="580" height="248" rx="9" fill="#f6fdf8" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="660" y="488" width="580" height="38" rx="9" fill="#16a34a"/>
  <rect x="660" y="516" width="580" height="10" fill="#16a34a"/>
  <text x="682" y="514" font-size="15" font-weight="700" fill="#ffffff">B300 训练集群</text>
  <text x="1218" y="514" font-size="12.5" font-weight="700" fill="#bbf7d0" text-anchor="end">127 节点 · 1,016 GPU</text>

  <rect x="680" y="540" width="268" height="86" rx="6" fill="#e6fbff" stroke="#0ea5b7" stroke-width="1.8"/>
  <text x="814" y="562" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">计算网络</text>
  <text x="814" y="582" font-size="10.5" fill="#334155" text-anchor="middle">双平面 RoCEv2</text>
  <text x="814" y="600" font-size="10.5" fill="#334155" text-anchor="middle">H3C LS9867-128DH × 48</text>
  <text x="814" y="617" font-size="10" fill="#0e7490" text-anchor="middle">32 Leaf + 16 Spine · 1:1 无阻塞</text>

  <rect x="964" y="540" width="258" height="86" rx="6" fill="#e8effc" stroke="#2563eb" stroke-width="1.8"/>
  <text x="1093" y="562" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">存储与管理</text>
  <text x="1093" y="582" font-size="10.5" fill="#334155" text-anchor="middle">存储节点 64 台 · WEKA</text>
  <text x="1093" y="600" font-size="10.5" fill="#334155" text-anchor="middle">H3C S9825 / S5590 / S6805</text>
  <text x="1093" y="617" font-size="10" fill="#1d4ed8" text-anchor="middle">独立带外管理网</text>

  <rect x="680" y="640" width="542" height="76" rx="6" fill="#eafaf0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="951" y="662" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">计算节点　技嘉 G894-ZD3-AAX7 · HGX B300 8-GPU</text>
  <text x="951" y="682" font-size="10.5" fill="#166534" text-anchor="middle">每节点 8 × 800G ConnectX-8，拆分双平面接入</text>
  <text x="951" y="702" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">节点间互联带宽 6.4 Tbps · 单机 NVLink 1.8 TB/s</text>

  <!-- 连线 集群到共享骨干 -->
  <line x1="330" y1="428" x2="330" y2="488" stroke="#ea7317" stroke-width="2.5"/>
  <path d="M 326 482 L 330 490 L 334 482 Z" fill="#ea7317"/>
  <line x1="950" y1="428" x2="950" y2="488" stroke="#ea7317" stroke-width="2.5"/>
  <path d="M 946 482 L 950 490 L 954 482 Z" fill="#ea7317"/>
  <line x1="390" y1="298" x2="330" y2="356" stroke="#5b21b6" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- ===== 底部：技术要点 ===== -->
  <rect x="40" y="756" width="1200" height="112" rx="9" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
  <text x="62" y="780" font-size="13.5" font-weight="700" fill="#0f172a">架构要点</text>

  <rect x="62" y="792" width="282" height="60" rx="6" fill="#ffffff" stroke="#0ea5b7" stroke-width="1.6"/>
  <text x="203" y="812" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">轨道优化拓扑</text>
  <text x="203" y="831" font-size="9.8" fill="#334155" text-anchor="middle">同号 GPU 独立平面通信</text>
  <text x="203" y="845" font-size="9.8" fill="#334155" text-anchor="middle">集合通信互不争抢</text>

  <rect x="358" y="792" width="282" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="499" y="812" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">三网物理隔离</text>
  <text x="499" y="831" font-size="9.8" fill="#334155" text-anchor="middle">计算 / 存储 / 带外管理</text>
  <text x="499" y="845" font-size="9.8" fill="#334155" text-anchor="middle">互不干扰，故障域独立</text>

  <rect x="654" y="792" width="282" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="795" y="812" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">存储资源池化</text>
  <text x="795" y="831" font-size="9.8" fill="#334155" text-anchor="middle">统一存储骨干服务双集群</text>
  <text x="795" y="845" font-size="9.8" fill="#334155" text-anchor="middle">存储节点合计 130 台</text>

  <rect x="950" y="792" width="290" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="1095" y="812" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">统一容器调度</text>
  <text x="1095" y="831" font-size="9.8" fill="#334155" text-anchor="middle">原生 Kubernetes + 整组调度</text>
  <text x="1095" y="845" font-size="9.8" fill="#334155" text-anchor="middle">多租户配额与拓扑感知</text>
</svg>
