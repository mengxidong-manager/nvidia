<text x='40' y='40' font-size='23' font-weight='700' fill='#ffffff'>S110 智算中心 — 整体网络架构</text>
<text x='40' y='68' font-size='13' fill='#94a3b8'>H200 与 B300 双训练集群 · 三张网物理隔离 · 计算与存储各自闭合 · 带外管理统一 · 路由器 → edge → 内部网络 · BCM + Slurm 统一调度</text>
