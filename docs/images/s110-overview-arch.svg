<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 880' font-family='Segoe UI, Arial, sans-serif'>
<defs>
<linearGradient id='hdr' x1='0' y1='0' x2='1' y2='0'>
<stop offset='0%' stop-color='#0f172a'/>
<stop offset='100%' stop-color='#1e3a5f'/>
</linearGradient>
</defs>
<rect x='0' y='0' width='1280' height='880' fill='#ffffff'/>
<rect x='0' y='0' width='1280' height='86' fill='url(#hdr)'/>
<text x='40' y='40' font-size='23' font-weight='700' fill='#ffffff'>S110 智算中心 — 整体网络架构</text>
<text x='40' y='68' font-size='13' fill='#94a3b8'>三层结构：出口路由器 / edge 交换机 / 集群层　·　每套集群内部网络完整，存储骨干在集群内部　·　BCM + Slurm 统一调度</text>

<rect x='40' y='100' width='222' height='68' rx='8' fill='#eafaf0' stroke='#16a34a' stroke-width='2'/>
<text x='151' y='132' font-size='25' font-weight='700' fill='#166534' text-anchor='middle'>1,272</text>
<text x='151' y='156' font-size='11.5' fill='#166534' text-anchor='middle'>GPU 总数</text>
<rect x='278' y='100' width='222' height='68' rx='8' fill='#eef6ff' stroke='#2563eb' stroke-width='2'/>
<text x='389' y='132' font-size='25' font-weight='700' fill='#1d4ed8' text-anchor='middle'>159</text>
<text x='389' y='156' font-size='11.5' fill='#1d4ed8' text-anchor='middle'>GPU 计算节点</text>
<rect x='516' y='100' width='222' height='68' rx='8' fill='#e6fbff' stroke='#0ea5b7' stroke-width='2'/>
<text x='627' y='132' font-size='25' font-weight='700' fill='#0e7490' text-anchor='middle'>130</text>
<text x='627' y='156' font-size='11.5' fill='#0e7490' text-anchor='middle'>存储节点（全属 B300）</text>
<rect x='754' y='100' width='222' height='68' rx='8' fill='#f3effc' stroke='#7c3aed' stroke-width='2'/>
<text x='865' y='132' font-size='25' font-weight='700' fill='#5b21b6' text-anchor='middle'>123</text>
<text x='865' y='156' font-size='11.5' fill='#5b21b6' text-anchor='middle'>交换机（33 + 90）</text>
<rect x='992' y='100' width='248' height='68' rx='8' fill='#fff8ec' stroke='#ea7317' stroke-width='2'/>
<text x='1116' y='132' font-size='25' font-weight='700' fill='#9a3412' text-anchor='middle'>~3.7 MW</text>
<text x='1116' y='156' font-size='11.5' fill='#9a3412' text-anchor='middle'>设施总功率（含制冷）</text>

<rect x='40' y='182' width='1200' height='28' rx='5' fill='#1f2937'/>
<text x='640' y='200' font-size='11' font-weight='700' fill='#ffffff' text-anchor='middle'>① 出口路由器层（两集群共用）　H3C CR16005E × 2　C22 列 U13 / D22 列 U13　·　防火墙旁挂（H3C）　—— 外部访问：路由器 → edge → 集群内部</text>

<text x='40' y='238' font-size='13' font-weight='700' fill='#475569'>② edge 交换机层</text>
<line x1='180' y1='233' x2='1240' y2='233' stroke='#e2e8f0' stroke-width='1.5'/>
<rect x='200' y='244' width='380' height='54' rx='7' fill='#ede9fe' stroke='#5b21b6' stroke-width='2.2'/>
<text x='390' y='266' font-size='13' font-weight='700' fill='#0f172a' text-anchor='middle'>H200 edge　NVIDIA SN4600 × 2</text>
<text x='390' y='287' font-size='10.5' fill='#5b21b6' text-anchor='middle'>C22/D22 列 U10　·　H200 内部网络的北向出口</text>
<rect x='700' y='244' width='380' height='54' rx='7' fill='#eef6ff' stroke='#1d4ed8' stroke-width='2.2'/>
<text x='890' y='266' font-size='13' font-weight='700' fill='#0f172a' text-anchor='middle'>B300 edge　H3C S9825 × 2</text>
<text x='890' y='287' font-size='10.5' fill='#1d4ed8' text-anchor='middle'>C22/D22 列 U17　·　B300 北向出口 + 两集群 IPMI 上行</text>

<line x1='390' y1='298' x2='390' y2='334' stroke='#5b21b6' stroke-width='2.4'/>
<path d='M 384 326 L 390 338 L 396 326 Z' fill='#5b21b6'/>
<line x1='890' y1='298' x2='890' y2='334' stroke='#1d4ed8' stroke-width='2.4'/>
<path d='M 884 326 L 890 338 L 896 326 Z' fill='#1d4ed8'/>

<text x='40' y='330' font-size='13' font-weight='700' fill='#475569'>③ 集群层</text>
<line x1='120' y1='325' x2='190' y2='325' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='40' y='340' width='580' height='378' rx='9' fill='#f8fbff' stroke='#2563eb' stroke-width='2.5'/>
<rect x='40' y='340' width='580' height='36' rx='9' fill='#2563eb'/>
<rect x='40' y='366' width='580' height='10' fill='#2563eb'/>
<text x='60' y='365' font-size='14.5' font-weight='700' fill='#ffffff'>H200 训练集群　内部网络完整</text>
<text x='600' y='365' font-size='11.5' font-weight='700' fill='#bfdbfe' text-anchor='end'>32 节点 · 256 GPU · 交换机 33 台</text>

<rect x='58' y='386' width='544' height='72' rx='6' fill='#e6fbff' stroke='#0ea5b7' stroke-width='1.8'/>
<text x='330' y='406' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>计算网　InfiniBand NDR　·　MQM9790 × 24</text>
<text x='330' y='425' font-size='10.5' fill='#334155' text-anchor='middle'>Spine 16（A01/A02/B01/B02 列 U10–U22）　←　Leaf 8（A03 列一柜 U10–U38）</text>
<text x='330' y='443' font-size='10' fill='#0e7490' text-anchor='middle'>Spine↔Leaf 与 Spine↔Spine 全连接，主备方式（实占 16 口 / 灯亮 8）· 收敛比 1:1</text>

<rect x='58' y='466' width='544' height='84' rx='6' fill='#f0fdf4' stroke='#166534' stroke-width='1.8'/>
<text x='330' y='486' font-size='12' font-weight='700' fill='#166534' text-anchor='middle'>存储网　DDN A³I + Spectrum　·　SN5600 × 6（本集群内部）</text>
<text x='330' y='505' font-size='10.5' fill='#334155' text-anchor='middle'>Spine 2（C22U37 / D22U31）　←　Leaf 4（C21/D21 U37 接 DDN，C23U37/D23U31 接节点）</text>
<text x='330' y='523' font-size='10.5' fill='#334155' text-anchor='middle'>→ DDN 存储服务器 + SM 服务器　D21 / D22 列共 15 台</text>
<text x='330' y='540' font-size='10' font-weight='600' fill='#15803d' text-anchor='middle'>节点 ↔ DDN 为 3 跳，在集群内部闭合，不经 edge</text>

<rect x='58' y='558' width='544' height='64' rx='6' fill='#eafaf0' stroke='#16a34a' stroke-width='1.8'/>
<text x='330' y='578' font-size='12' font-weight='700' fill='#166534' text-anchor='middle'>计算节点 × 32　Aivres KR6288 V2 · HGX H200 8-GPU</text>
<text x='330' y='597' font-size='10.5' fill='#334155' text-anchor='middle'>每节点 8 × 400G 计算网卡，一卡一轨道　·　A 列 20 台 + B 列 12 台</text>
<text x='330' y='614' font-size='10.5' font-weight='600' fill='#15803d' text-anchor='middle'>节点间互联带宽 3.2 Tbps</text>

<rect x='58' y='630' width='544' height='72' rx='6' fill='#f3effc' stroke='#7c3aed' stroke-width='1.8'/>
<text x='330' y='650' font-size='12' font-weight='700' fill='#5b21b6' text-anchor='middle'>单 Pod 结构　·　带外管理</text>
<text x='330' y='669' font-size='10.5' fill='#334155' text-anchor='middle'>32 节点全部在同一 rail 域内，集合通信可在 Leaf 层闭合</text>
<text x='330' y='688' font-size='10.5' fill='#334155' text-anchor='middle'>BMC → 自有 S5590（C22 列 U33）→ IPMI Spine → B300 edge</text>

<rect x='660' y='340' width='580' height='378' rx='9' fill='#f6fdf8' stroke='#16a34a' stroke-width='2.5'/>
<rect x='660' y='340' width='580' height='36' rx='9' fill='#16a34a'/>
<rect x='660' y='366' width='580' height='10' fill='#16a34a'/>
<text x='680' y='365' font-size='14.5' font-weight='700' fill='#ffffff'>B300 训练集群　内部网络完整</text>
<text x='1220' y='365' font-size='11.5' font-weight='700' fill='#bbf7d0' text-anchor='end'>127 节点 · 1,016 GPU · 交换机 90 台</text>

<rect x='678' y='386' width='544' height='72' rx='6' fill='#e6fbff' stroke='#0ea5b7' stroke-width='1.8'/>
<text x='950' y='406' font-size='12' font-weight='700' fill='#0e7490' text-anchor='middle'>计算网　双平面 RoCEv2　·　LS9867-128DH × 48</text>
<text x='950' y='425' font-size='10.5' fill='#334155' text-anchor='middle'>每平面 Spine 8　←　Leaf 16　·　双 Pod（Pod A 64 台 / Pod B 63 台）</text>
<text x='950' y='443' font-size='10' fill='#0e7490' text-anchor='middle'>Spine↔Leaf 与 Spine↔Spine 全连接，负载分担（端口灯全亮）· 严格 1:1 无阻塞</text>

<rect x='678' y='466' width='544' height='84' rx='6' fill='#fff8ec' stroke='#ea7317' stroke-width='2.2'/>
<text x='950' y='486' font-size='12' font-weight='700' fill='#9a3412' text-anchor='middle'>存储网　WEKA　·　S9825（本集群内部，H200 不接入）</text>
<text x='950' y='505' font-size='10.5' font-weight='600' fill='#9a3412' text-anchor='middle'>存储网骨干 Spine 16（G23 / G22 / F23 / F22 列各 4 台）</text>
<text x='950' y='523' font-size='10.5' fill='#334155' text-anchor='middle'>← Leaf 14（存储 Server 4 + 计算节点存储 8 + 管理 2）　+　64 台存储 Server 直连骨干</text>
<text x='950' y='540' font-size='10' font-weight='600' fill='#7c2d12' text-anchor='middle'>→ 存储节点 130 台　·　3.2 TB/s　·　23.6 PB（第一批 64 台基准）</text>

<rect x='678' y='558' width='544' height='64' rx='6' fill='#eafaf0' stroke='#16a34a' stroke-width='1.8'/>
<text x='950' y='578' font-size='12' font-weight='700' fill='#166534' text-anchor='middle'>计算节点 × 127　技嘉 G894-ZD3-AAX7 · HGX B300 8-GPU</text>
<text x='950' y='597' font-size='10.5' fill='#334155' text-anchor='middle'>每节点 8 × 800G ConnectX-8，每口拆 2×400G 分入两个独立平面</text>
<text x='950' y='614' font-size='10.5' font-weight='600' fill='#15803d' text-anchor='middle'>节点间互联带宽 6.4 Tbps　·　节点内 NVLink 1.8 TB/s</text>

<rect x='678' y='630' width='544' height='72' rx='6' fill='#f3effc' stroke='#7c3aed' stroke-width='1.8'/>
<text x='950' y='650' font-size='12' font-weight='700' fill='#5b21b6' text-anchor='middle'>双 Pod 结构　·　带外管理</text>
<text x='950' y='669' font-size='10.5' fill='#334155' text-anchor='middle'>≤64 节点作业在 Pod 内闭合；跨 Pod 经 Spine 一跳（3 跳）</text>
<text x='950' y='688' font-size='10.5' fill='#334155' text-anchor='middle'>BMC → 自有 S5590 × 8 → IPMI Spine × 2（C22/D22 U40）→ B300 edge</text>

<rect x='40' y='736' width='1200' height='124' rx='9' fill='#f8fafc' stroke='#1f2937' stroke-width='2'/>
<text x='62' y='760' font-size='13.5' font-weight='700' fill='#0f172a'>架构要点</text>
<rect x='62' y='772' width='282' height='74' rx='6' fill='#ffffff' stroke='#1f2937' stroke-width='1.6'/>
<text x='203' y='792' font-size='11.5' font-weight='700' fill='#0f172a' text-anchor='middle'>只有三层</text>
<text x='203' y='810' font-size='9.8' fill='#334155' text-anchor='middle'>出口路由器 / edge / 集群</text>
<text x='203' y='824' font-size='9.8' fill='#334155' text-anchor='middle'>存储骨干在 B300 集群内部，</text>
<text x='203' y='838' font-size='9.8' font-weight='600' fill='#9a3412' text-anchor='middle'>不是中心级共享层</text>
<rect x='358' y='772' width='282' height='74' rx='6' fill='#ffffff' stroke='#0ea5b7' stroke-width='1.6'/>
<text x='499' y='792' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>处处全连接，两种转发</text>
<text x='499' y='810' font-size='9.8' fill='#334155' text-anchor='middle'>Leaf↔Spine 与 Spine↔Spine 全连接</text>
<text x='499' y='824' font-size='9.8' fill='#334155' text-anchor='middle'>H200 主备（占 16 亮 8）</text>
<text x='499' y='838' font-size='9.8' fill='#334155' text-anchor='middle'>B300 负载分担（灯全亮）</text>
<rect x='654' y='772' width='282' height='74' rx='6' fill='#ffffff' stroke='#16a34a' stroke-width='1.6'/>
<text x='795' y='792' font-size='11.5' font-weight='700' fill='#166534' text-anchor='middle'>两套独立存储体系</text>
<text x='795' y='810' font-size='9.8' fill='#334155' text-anchor='middle'>H200：DDN A³I + Spectrum</text>
<text x='795' y='824' font-size='9.8' fill='#334155' text-anchor='middle'>B300：WEKA + S9825 骨干</text>
<text x='795' y='838' font-size='9.8' font-weight='600' fill='#15803d' text-anchor='middle'>两者无任何连接</text>
<rect x='950' y='772' width='290' height='74' rx='6' fill='#ffffff' stroke='#7c3aed' stroke-width='1.6'/>
<text x='1095' y='792' font-size='11.5' font-weight='700' fill='#5b21b6' text-anchor='middle'>统一带外 + 统一出口</text>
<text x='1095' y='810' font-size='9.8' fill='#334155' text-anchor='middle'>两集群 IPMI 是同一张网</text>
<text x='1095' y='824' font-size='9.8' fill='#334155' text-anchor='middle'>经 B300 edge → 出口路由器</text>
<text x='1095' y='838' font-size='9.8' fill='#334155' text-anchor='middle'>BCM + Slurm 统一调度</text>
</svg>
