<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 1020' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1400' height='1020' fill='#ffffff'/>
<rect x='0' y='0' width='1400' height='78' fill='#0f172a'/>
<text x='36' y='36' font-size='21' font-weight='700' fill='#ffffff'>上层软件架构与调度拓扑映射详图</text>
<text x='36' y='62' font-size='12.5' fill='#94a3b8'>NVIDIA Base Command Manager（BCM）+ Slurm · Pyxis/Enroot 容器执行 · topology.conf 感知 Pod 边界</text>

<rect x='30' y='96' width='1340' height='48' rx='7' fill='#f8fafc' stroke='#1f2937' stroke-width='1.6'/>
<text x='46' y='116' font-size='12' font-weight='700' fill='#0f172a'>定位</text>
<text x='46' y='134' font-size='11' fill='#334155'>BCM 负责「机器的一致性」——节点镜像化部署、配置管理、健康检查与监控；Slurm 负责「作业的分配」——队列、配额、抢占与拓扑感知放置。两者分工清晰，共同覆盖 159 个计算节点。</text>

<rect x='30' y='162' width='436' height='336' rx='9' fill='#faf8ff' stroke='#7c3aed' stroke-width='2.4'/>
<rect x='30' y='162' width='436' height='32' rx='9' fill='#7c3aed'/>
<rect x='30' y='184' width='436' height='10' fill='#7c3aed'/>
<text x='48' y='184' font-size='13' font-weight='700' fill='#ffffff'>① 集群管理　NVIDIA Base Command Manager</text>

<rect x='48' y='208' width='400' height='56' rx='5' fill='#ede9fe' stroke='#5b21b6' stroke-width='1.6'/>
<text x='248' y='228' font-size='11.5' font-weight='700' fill='#5b21b6' text-anchor='middle'>Head Node　主备双机热备（HA）</text>
<text x='248' y='246' font-size='10.5' fill='#334155' text-anchor='middle'>配置与元数据实时同步　·　承载 cmsh / Base View</text>
<text x='248' y='259' font-size='10' fill='#64748b' text-anchor='middle'>部署于 C19/C20 列 U31 管理 Server Leaf 下</text>

<rect x='48' y='274' width='400' height='84' rx='5' fill='#f3effc' stroke='#5b21b6' stroke-width='1.5'/>
<text x='62' y='294' font-size='11' font-weight='700' fill='#5b21b6'>镜像化节点部署（PXE）</text>
<text x='62' y='313' font-size='10.5' fill='#334155'>计算节点从头节点拉取软件镜像启动，不做本地安装</text>
<text x='62' y='330' font-size='10.5' fill='#334155'>驱动、内核参数、NCCL 配置随镜像统一下发</text>
<text x='62' y='350' font-size='10.5' font-weight='600' fill='#166534'>→ 消除 159 个节点逐机配置造成的漂移，可整体回滚</text>

<rect x='48' y='368' width='400' height='62' rx='5' fill='#ffffff' stroke='#5b21b6' stroke-width='1.4'/>
<text x='62' y='388' font-size='11' font-weight='700' fill='#5b21b6'>节点分类（Category）</text>
<text x='62' y='406' font-size='10.5' fill='#334155'>H200 计算　·　B300 计算　·　存储　·　管理</text>
<text x='62' y='422' font-size='10' fill='#64748b'>各类别独立维护镜像与配置，两套异构集群互不干扰</text>

<rect x='48' y='438' width='400' height='48' rx='5' fill='#ffffff' stroke='#5b21b6' stroke-width='1.4'/>
<text x='62' y='458' font-size='11' font-weight='700' fill='#5b21b6'>健康检查与监控告警</text>
<text x='62' y='476' font-size='10.5' fill='#334155'>周期性检查 + 自动隔离异常节点　·　硬件/GPU/网络/作业指标采集</text>

<rect x='482' y='162' width='436' height='336' rx='9' fill='#f0fcff' stroke='#0ea5b7' stroke-width='2.4'/>
<rect x='482' y='162' width='436' height='32' rx='9' fill='#0ea5b7'/>
<rect x='482' y='184' width='436' height='10' fill='#0ea5b7'/>
<text x='500' y='184' font-size='13' font-weight='700' fill='#ffffff'>② 作业调度　Slurm</text>

<rect x='500' y='208' width='400' height='44' rx='5' fill='#cffafe' stroke='#0e7490' stroke-width='1.6'/>
<text x='700' y='227' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>slurmctld（控制面）+ slurmdbd（账务）</text>
<text x='700' y='244' font-size='10' fill='#334155' text-anchor='middle'>每计算节点运行 slurmd　·　Munge 认证</text>

<rect x='500' y='260' width='400' height='84' rx='5' fill='#e6fbff' stroke='#0e7490' stroke-width='1.5'/>
<text x='514' y='280' font-size='11' font-weight='700' fill='#0e7490'>资源与隔离</text>
<text x='514' y='299' font-size='10.5' fill='#334155'>GPU 资源　gres/gpu，每节点 8 卡，整卡分配不切 MIG</text>
<text x='514' y='316' font-size='10.5' fill='#334155'>资源隔离　cgroup 约束 CPU / 内存 / GPU 设备可见性</text>
<text x='514' y='334' font-size='10.5' fill='#334155'>独占策略　训练作业默认 --exclusive 整节点独占</text>

<rect x='500' y='352' width='400' height='66' rx='5' fill='#ffffff' stroke='#0e7490' stroke-width='1.4'/>
<text x='514' y='372' font-size='11' font-weight='700' fill='#0e7490'>队列与配额</text>
<text x='514' y='390' font-size='10.5' fill='#334155'>分区（Partition）按集群与 Pod 划分，便于定向投递</text>
<text x='514' y='406' font-size='10.5' fill='#334155'>Fairshare + 多级账户　·　高优作业可抢占，从 Checkpoint 续跑</text>

<rect x='500' y='426' width='400' height='60' rx='5' fill='#fff8ec' stroke='#ea7317' stroke-width='1.5'/>
<text x='514' y='446' font-size='11' font-weight='700' fill='#9a3412'>Prolog / Epilog 健康联动（掉卡场景关键）</text>
<text x='514' y='464' font-size='10.5' fill='#334155'>作业前检查 GPU 可见性、ECC 状态、NVLink 链路、网卡 link up</text>
<text x='514' y='480' font-size='10.5' font-weight='600' fill='#9a3412'>任一不通过 → 节点置 drain 并把作业重调度到健康节点</text>

<rect x='934' y='162' width='436' height='336' rx='9' fill='#f6fdf8' stroke='#16a34a' stroke-width='2.4'/>
<rect x='934' y='162' width='436' height='32' rx='9' fill='#16a34a'/>
<rect x='934' y='184' width='436' height='10' fill='#16a34a'/>
<text x='952' y='184' font-size='13' font-weight='700' fill='#ffffff'>③ 容器执行与软件栈</text>

<rect x='952' y='208' width='400' height='96' rx='5' fill='#dcfce7' stroke='#166534' stroke-width='1.6'/>
<text x='966' y='228' font-size='11' font-weight='700' fill='#166534'>Pyxis + Enroot（无 root 容器）</text>
<text x='966' y='248' font-size='10.5' fill='#334155'>Enroot　将镜像展开为非特权沙箱，无需 Docker daemon</text>
<text x='966' y='265' font-size='10.5' fill='#334155'>Pyxis　Slurm SPANK 插件，srun --container-image 直接起容器</text>
<text x='966' y='282' font-size='10.5' fill='#334155'>NGC 镜像　官方 PyTorch / NeMo，驱动与库版本已验证匹配</text>
<text x='966' y='298' font-size='10' fill='#15803d'>RDMA 设备与 NVLink 拓扑对容器内进程透明，无需网络插件链路</text>

<rect x='952' y='312' width='400' height='74' rx='5' fill='#ffffff' stroke='#166534' stroke-width='1.4'/>
<text x='966' y='332' font-size='11' font-weight='700' fill='#166534'>软件栈（environment modules 多版本并存）</text>
<text x='966' y='351' font-size='10.5' fill='#334155'>CUDA Toolkit　·　NCCL　·　HPC-X　·　OpenMPI</text>
<text x='966' y='368' font-size='10.5' fill='#334155'>cuDNN / cuBLAS　·　Python / PyTorch 多环境</text>
<text x='966' y='382' font-size='10' fill='#64748b'>模块化加载避免版本冲突，作业脚本显式声明依赖</text>

<rect x='952' y='394' width='400' height='92' rx='5' fill='#ffffff' stroke='#166534' stroke-width='1.4'/>
<text x='966' y='414' font-size='11' font-weight='700' fill='#166534'>NCCL 关键配置（按集群区分）</text>
<text x='966' y='433' font-size='10.5' fill='#334155'>B300（RoCEv2）　识别双平面 16 条链路 · GID index · ToS</text>
<text x='966' y='450' font-size='10.5' fill='#334155'>　　　　　　　　MTU 9000 · NUMA 亲和（GPU↔CX-8↔CPU）</text>
<text x='966' y='467' font-size='10.5' fill='#334155'>H200（InfiniBand）　Subnet Manager 配置 · rail 亲和性</text>
<text x='966' y='482' font-size='10' fill='#9a3412'>若 NCCL 未识别全部链路，All-Reduce 打不满带宽</text>

<text x='36' y='536' font-size='13.5' font-weight='700' fill='#475569'>topology.conf — 物理拓扑到调度器的映射</text>
<line x1='400' y1='531' x2='1370' y2='531' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='30' y='552' width='820' height='250' rx='9' fill='#f8fafc' stroke='#1f2937' stroke-width='2'/>
<rect x='60' y='572' width='760' height='40' rx='5' fill='#ede9fe' stroke='#5b21b6' stroke-width='1.6'/>
<text x='440' y='597' font-size='12' font-weight='700' fill='#5b21b6' text-anchor='middle'>根层　跨 Pod（经 Spine 转发，3 跳）</text>
<line x1='250' y1='612' x2='250' y2='634' stroke='#64748b' stroke-width='2'/>
<line x1='630' y1='612' x2='630' y2='634' stroke='#64748b' stroke-width='2'/>

<rect x='60' y='636' width='368' height='46' rx='5' fill='#dcfce7' stroke='#166534' stroke-width='1.6'/>
<text x='244' y='656' font-size='11.5' font-weight='700' fill='#166534' text-anchor='middle'>中间层　Pod A</text>
<text x='244' y='673' font-size='10.5' fill='#334155' text-anchor='middle'>64 节点 · 512 GPU · 16 Leaf</text>
<rect x='452' y='636' width='368' height='46' rx='5' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.6'/>
<text x='636' y='656' font-size='11.5' font-weight='700' fill='#1d4ed8' text-anchor='middle'>中间层　Pod B</text>
<text x='636' y='673' font-size='10.5' fill='#334155' text-anchor='middle'>63 节点 · 504 GPU · 16 Leaf</text>

<line x1='140' y1='682' x2='140' y2='704' stroke='#64748b' stroke-width='1.6'/>
<line x1='244' y1='682' x2='244' y2='704' stroke='#64748b' stroke-width='1.6'/>
<line x1='348' y1='682' x2='348' y2='704' stroke='#64748b' stroke-width='1.6'/>
<line x1='532' y1='682' x2='532' y2='704' stroke='#64748b' stroke-width='1.6'/>
<line x1='636' y1='682' x2='636' y2='704' stroke='#64748b' stroke-width='1.6'/>
<line x1='740' y1='682' x2='740' y2='704' stroke='#64748b' stroke-width='1.6'/>

<rect x='60' y='706' width='160' height='40' rx='4' fill='#e6fbff' stroke='#0e7490' stroke-width='1.3'/>
<text x='140' y='724' font-size='10' font-weight='600' fill='#0e7490' text-anchor='middle'>叶子层　A·rail0</text>
<text x='140' y='739' font-size='9.5' fill='#334155' text-anchor='middle'>该 Leaf 覆盖的 64 节点</text>
<rect x='228' y='706' width='160' height='40' rx='4' fill='#e6fbff' stroke='#0e7490' stroke-width='1.3'/>
<text x='308' y='724' font-size='10' font-weight='600' fill='#0e7490' text-anchor='middle'>…　A·rail1–6</text>
<text x='308' y='739' font-size='9.5' fill='#334155' text-anchor='middle'>（共 8 rail × 2 平面）</text>
<rect x='396' y='706' width='160' height='40' rx='4' fill='#e6fbff' stroke='#0e7490' stroke-width='1.3'/>
<text x='476' y='724' font-size='10' font-weight='600' fill='#0e7490' text-anchor='middle'>叶子层　A·rail7</text>
<text x='476' y='739' font-size='9.5' fill='#334155' text-anchor='middle'>该 Leaf 覆盖的 64 节点</text>
<rect x='564' y='706' width='256' height='40' rx='4' fill='#e6fbff' stroke='#0e7490' stroke-width='1.3'/>
<text x='692' y='724' font-size='10' font-weight='600' fill='#0e7490' text-anchor='middle'>叶子层　B·rail0 … B·rail7</text>
<text x='692' y='739' font-size='9.5' fill='#334155' text-anchor='middle'>每台 Leaf 覆盖该 Pod 的 63 节点</text>

<text x='60' y='770' font-size='10.5' fill='#334155'>Slurm 通过 switch/node 层级描述上述三级结构，使调度器在放置作业时知道哪些节点「网络上更近」。</text>
<text x='60' y='789' font-size='10.5' fill='#64748b'>注：H200 集群 32 节点全部落在同一 rail 域内，其 topology.conf 只需两级（Leaf → 集群），无 Pod 中间层。</text>

<rect x='866' y='552' width='504' height='250' rx='9' fill='#fff8ec' stroke='#ea7317' stroke-width='2'/>
<text x='884' y='576' font-size='12.5' font-weight='700' fill='#9a3412'>调度策略（直接决定大作业通信效率）</text>
<rect x='884' y='588' width='468' height='56' rx='5' fill='#ffffff' stroke='#166534' stroke-width='1.5'/>
<text x='898' y='608' font-size='11' font-weight='700' fill='#166534'>① ≤ 64 节点作业 → 优先单 Pod 内</text>
<text x='898' y='626' font-size='10.5' fill='#334155'>集合通信在 Leaf 层闭合，不经 Spine，跳数 1 跳</text>
<text x='898' y='640' font-size='10' fill='#64748b'>这是 Pod 划分在软件侧最重要的一条映射</text>

<rect x='884' y='652' width='468' height='56' rx='5' fill='#ffffff' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='898' y='672' font-size='11' font-weight='700' fill='#1d4ed8'>② &gt; 64 节点作业 → 必然跨 Pod</text>
<text x='898' y='690' font-size='10.5' fill='#334155'>调度器选择使跨 Pod 边界最小的节点组合，经 Spine 一跳</text>
<text x='898' y='704' font-size='10' fill='#64748b'>千卡作业需同时占用两个 Pod</text>

<rect x='884' y='716' width='468' height='70' rx='5' fill='#fef2f2' stroke='#9a3412' stroke-width='1.5'/>
<text x='898' y='736' font-size='11' font-weight='700' fill='#9a3412'>③ 避免跨 Pod 碎片化分配</text>
<text x='898' y='754' font-size='10.5' fill='#334155'>反例：两个 32 节点作业各占半个 Pod</text>
<text x='898' y='771' font-size='10.5' fill='#334155'>→ 后续 64 节点作业无法在单 Pod 内满足，被迫跨 Pod 降速</text>
<text x='898' y='784' font-size='10' fill='#64748b'>需在分区规划与回填策略上一并约束</text>

<rect x='30' y='822' width='1340' height='176' rx='9' fill='#f8fafc' stroke='#1f2937' stroke-width='1.8'/>
<text x='46' y='846' font-size='12.5' font-weight='700' fill='#0f172a'>无损网络调优与可观测</text>

<rect x='46' y='858' width='424' height='126' rx='6' fill='#ffffff' stroke='#0ea5b7' stroke-width='1.5'/>
<text x='60' y='878' font-size='11' font-weight='700' fill='#0e7490'>B300 · RoCEv2 三层调优</text>
<text x='60' y='898' font-size='10.5' fill='#334155'>主机侧　PFC / ECN / DCQCN 参数整定、CX-8 RoCE 参数</text>
<text x='60' y='916' font-size='10.5' fill='#334155'>交换机侧　AI ECN 门限自适应、PFC 死锁检测、Agile Buffer</text>
<text x='60' y='934' font-size='10.5' fill='#334155'>负载均衡　ECMP / Flowlet / Spraylink 逐包 AR、DPSH 自愈</text>
<text x='60' y='954' font-size='10.5' font-weight='600' fill='#9a3412'>RoCEv2 性能上限完全取决于无损网络是否调好</text>
<text x='60' y='972' font-size='10' fill='#64748b'>训练 All-Reduce 通常逐包 AR 效果最佳，需与 NCCL 联调验证</text>

<rect x='486' y='858' width='424' height='126' rx='6' fill='#ffffff' stroke='#5b21b6' stroke-width='1.5'/>
<text x='500' y='878' font-size='11' font-weight='700' fill='#5b21b6'>监控指标体系</text>
<text x='500' y='898' font-size='10.5' fill='#334155'>GPU　DCGM-exporter：利用率、显存、温度、功耗、ECC、NVLink</text>
<text x='500' y='916' font-size='10.5' fill='#334155'>网络　端口流量、PFC 触发次数、ECN 标记率、丢包计数</text>
<text x='500' y='934' font-size='10.5' fill='#334155'>作业　Slurm 队列深度、等待时长、节点利用率</text>
<text x='500' y='954' font-size='10.5' fill='#334155'>聚合　BCM 内置监控 + Prometheus + Grafana 统一面板</text>
<text x='500' y='972' font-size='10' fill='#9a3412'>PFC 触发与 ECN 标记率异常升高，往往先于训练性能下降出现</text>

<rect x='926' y='858' width='428' height='126' rx='6' fill='#ffffff' stroke='#166534' stroke-width='1.5'/>
<text x='940' y='878' font-size='11' font-weight='700' fill='#166534'>基准与验收</text>
<text x='940' y='898' font-size='10.5' fill='#334155'>定期执行全规模 NCCL all-reduce / all-to-all 基准</text>
<text x='940' y='916' font-size='10.5' fill='#334155'>建立性能基线：单 Pod 内 vs 跨 Pod 的实测差异</text>
<text x='940' y='934' font-size='10.5' fill='#334155'>以实测基准替代厂商标称值</text>
<text x='940' y='954' font-size='10.5' fill='#334155'>与 H200（IB）横向对比，量化 RoCEv2 调优成效</text>
<text x='940' y='972' font-size='10' fill='#64748b'>基准数据同时作为掉卡/链路故障后的恢复判据</text>
</svg>
