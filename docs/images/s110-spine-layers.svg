<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1340 930' font-family='Segoe UI, Arial, sans-serif'>
<rect x='0' y='0' width='1340' height='930' fill='#ffffff'/>
<rect x='0' y='0' width='1340' height='74' fill='#1f2937'/>
<text x='34' y='34' font-size='20' font-weight='700' fill='#ffffff'>各网络的 Spine 层与层间连接　主备 vs 负载分担</text>
<text x='34' y='58' font-size='12.5' fill='#94a3b8'>所有网络的 Leaf↔Spine 与 Spine↔Spine 都是全连接 · 差别在转发方式 · 现场判据：端口占用数与点亮数是否一致</text>

<rect x='30' y='92' width='1280' height='74' rx='7' fill='#fff8ec' stroke='#ea7317' stroke-width='2.2'/>
<text x='46' y='114' font-size='12.5' font-weight='700' fill='#9a3412'>核心结论</text>
<text x='46' y='135' font-size='11' fill='#334155'>H200（InfiniBand）：Spine 每台实占 16 个端口，但端口灯只亮 8 个 → 另 8 口为 Spine 之间的全连接备份链路，常态不承载流量，即主备（active / standby）方式。</text>
<text x='46' y='155' font-size='11' fill='#334155'>B300（RoCEv2）：Spine↔Spine 与 Spine↔Leaf 端口灯全亮 → 全部链路同时承载流量，即负载分担（load-sharing）方式，由 ECMP / Flowlet / 逐包 AR 打散。</text>

<text x='34' y='200' font-size='13' font-weight='700' fill='#475569'>两种转发方式对照</text>
<line x1='210' y1='195' x2='1310' y2='195' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='30' y='214' width='630' height='230' rx='8' fill='#f0fcff' stroke='#0e7490' stroke-width='2.2'/>
<rect x='30' y='214' width='630' height='32' rx='8' fill='#0e7490'/>
<rect x='30' y='236' width='630' height='10' fill='#0e7490'/>
<text x='46' y='236' font-size='13' font-weight='700' fill='#ffffff'>H200 计算网　主备（active / standby）</text>
<text x='46' y='270' font-size='11' fill='#334155'>Leaf　8 台，A03 列一柜（U10/U14/U18/U22/U26/U30/U34/U38）</text>
<text x='46' y='290' font-size='11' fill='#334155'>Spine　16 台，A01/A02/B01/B02 列各 4 台（U10/U14/U18/U22）</text>
<text x='46' y='312' font-size='11' font-weight='600' fill='#0e7490'>Leaf 端口　16 下行 + 16 上行 = 32 / 32 全满</text>
<text x='46' y='332' font-size='11' font-weight='600' fill='#9a3412'>Spine 端口　实占 16，灯亮 8（下行 Leaf）+ 不亮 8（Spine 间备份）</text>
<text x='46' y='356' font-size='11' fill='#334155'>校验　Leaf 上行 8×16 = 128 条　÷　16 台 Spine = 每台 8 条下行　✓</text>
<text x='46' y='378' font-size='11' fill='#334155'>带宽利用率　约 50%，备份链路闲置</text>
<text x='46' y='398' font-size='11' fill='#334155'>故障行为　Subnet Manager 重算路由，切到备份路径（有收敛时间）</text>
<text x='46' y='418' font-size='11' fill='#334155'>优点　路径确定、时延抖动小、无需队列调优</text>
<text x='46' y='436' font-size='10' fill='#64748b'>Spine 即 IB fabric 最高层，无上行</text>

<rect x='680' y='214' width='630' height='230' rx='8' fill='#eef6ff' stroke='#1d4ed8' stroke-width='2.2'/>
<rect x='680' y='214' width='630' height='32' rx='8' fill='#1d4ed8'/>
<rect x='680' y='236' width='630' height='10' fill='#1d4ed8'/>
<text x='696' y='236' font-size='13' font-weight='700' fill='#ffffff'>B300 计算网　负载分担（load-sharing）</text>
<text x='696' y='270' font-size='11' fill='#334155'>Leaf　32 台（每平面 16）　Spine　16 台（每平面 8）</text>
<text x='696' y='290' font-size='11' fill='#334155'>双平面各自成网，平面之间无任何横向连接</text>
<text x='696' y='312' font-size='11' font-weight='600' fill='#1d4ed8'>Leaf 端口　64 下行 + 64 上行 = 128 / 128，严格 1:1 无阻塞</text>
<text x='696' y='332' font-size='11' font-weight='600' fill='#166534'>Spine 端口　端口灯全亮，无备份闲置链路</text>
<text x='696' y='356' font-size='11' fill='#9a3412'>待核实　Leaf 下行与 Spine 横向各占多少端口，需按现网配置核对</text>
<text x='696' y='378' font-size='11' fill='#334155'>带宽利用率　接近 100%</text>
<text x='696' y='398' font-size='11' fill='#334155'>故障行为　流量重新哈希到剩余 Spine，带宽按比例降约 1/8</text>
<text x='696' y='418' font-size='11' fill='#334155'>代价　需与 NCCL、PFC / ECN 三层联调，存在哈希不均衡可能</text>
<text x='696' y='436' font-size='10' fill='#64748b'>Spine 即本平面最高层，流量不出平面</text>

<text x='34' y='480' font-size='13' font-weight='700' fill='#475569'>逐网络的 Spine 层、Spine 间连接与上行</text>
<line x1='340' y1='475' x2='1310' y2='475' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='30' y='494' width='1280' height='28' fill='#1f2937'/>
<text x='44' y='513' font-size='11' font-weight='700' fill='#ffffff'>网络</text>
<text x='330' y='513' font-size='11' font-weight='700' fill='#ffffff'>Spine 配置与 U 位</text>
<text x='760' y='513' font-size='11' font-weight='700' fill='#ffffff'>Spine↔Spine / Spine↔Leaf</text>
<text x='1040' y='513' font-size='11' font-weight='700' fill='#ffffff'>上行去向</text>

<rect x='30' y='522' width='1280' height='34' fill='#f0fcff' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='544' font-size='10.5' font-weight='600' fill='#0e7490'>H200 计算网</text>
<text x='330' y='544' font-size='10.5' fill='#334155'>MQM9790 × 16　A01/A02/B01/B02 列 U10/U14/U18/U22</text>
<text x='760' y='544' font-size='10.5' font-weight='600' fill='#0e7490'>全连接，主备</text>
<text x='1040' y='544' font-size='10.5' fill='#334155'>无（IB fabric 最高层）</text>

<rect x='30' y='556' width='1280' height='34' fill='#f3effc' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='578' font-size='10.5' font-weight='600' fill='#5b21b6'>H200 存储网</text>
<text x='330' y='578' font-size='10.5' fill='#334155'>SN5600 × 2　C22 列 U37 / D22 列 U31</text>
<text x='760' y='578' font-size='10.5' fill='#334155'>全连接（冗余对）</text>
<text x='1040' y='578' font-size='10.5' fill='#334155'>SN4600 核心 → 出口路由器</text>

<rect x='30' y='590' width='1280' height='34' fill='#eef6ff' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='612' font-size='10.5' font-weight='600' fill='#1d4ed8'>B300 计算网 · 平面 1</text>
<text x='330' y='612' font-size='10.5' fill='#334155'>LS9867-128DH × 8</text>
<text x='760' y='612' font-size='10.5' font-weight='600' fill='#1d4ed8'>全连接，负载分担</text>
<text x='1040' y='612' font-size='10.5' fill='#334155'>无（平面内闭合）</text>

<rect x='30' y='624' width='1280' height='34' fill='#eef6ff' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='646' font-size='10.5' font-weight='600' fill='#1d4ed8'>B300 计算网 · 平面 2</text>
<text x='330' y='646' font-size='10.5' fill='#334155'>LS9867-128DH × 8</text>
<text x='760' y='646' font-size='10.5' font-weight='600' fill='#1d4ed8'>全连接，负载分担</text>
<text x='1040' y='646' font-size='10.5' fill='#334155'>无（平面内闭合）</text>

<rect x='30' y='658' width='1280' height='34' fill='#fff8ec' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='680' font-size='10.5' font-weight='600' fill='#9a3412'>B300 存储网骨干</text>
<text x='330' y='680' font-size='10.5' fill='#334155'>S9825 × 16　G23 / G22 / F23 / F22 列各 4 台</text>
<text x='760' y='680' font-size='10.5' fill='#334155'>全连接，负载分担</text>
<text x='1040' y='680' font-size='10.5' fill='#334155'>存储网核心 U17 → 出口路由器</text>

<rect x='30' y='692' width='1280' height='34' fill='#faf8ff' stroke='#cbd5e1' stroke-width='1'/>
<text x='44' y='714' font-size='10.5' font-weight='600' fill='#5b21b6'>带外管理网（两集群统一）</text>
<text x='330' y='714' font-size='10.5' fill='#334155'>S6805 × 2　C22 列 U40 / D22 列 U40</text>
<text x='760' y='714' font-size='10.5' fill='#334155'>冗余对，接入侧全连接</text>
<text x='1040' y='714' font-size='10.5' fill='#334155'>全机房 IPMI 核心 U17 → 出口路由器</text>

<text x='34' y='762' font-size='13' font-weight='700' fill='#475569'>三类核心在出口路由器收口</text>
<line x1='280' y1='757' x2='1310' y2='757' stroke='#e2e8f0' stroke-width='1.5'/>

<rect x='30' y='776' width='300' height='56' rx='6' fill='#faf8ff' stroke='#5b21b6' stroke-width='1.8'/>
<text x='180' y='798' font-size='11.5' font-weight='700' fill='#5b21b6' text-anchor='middle'>全机房 IPMI 核心</text>
<text x='180' y='818' font-size='10' fill='#334155' text-anchor='middle'>H3C S9825 × 2　C22/D22 U17</text>

<rect x='346' y='776' width='300' height='56' rx='6' fill='#f0fcff' stroke='#0e7490' stroke-width='1.8'/>
<text x='496' y='798' font-size='11.5' font-weight='700' fill='#0e7490' text-anchor='middle'>H200 存储网核心</text>
<text x='496' y='818' font-size='10' fill='#334155' text-anchor='middle'>NVIDIA SN4600 × 2　C22/D22 U10</text>

<rect x='662' y='776' width='300' height='56' rx='6' fill='#fff8ec' stroke='#9a3412' stroke-width='1.8'/>
<text x='812' y='798' font-size='11.5' font-weight='700' fill='#9a3412' text-anchor='middle'>B300 存储网核心</text>
<text x='812' y='818' font-size='10' fill='#334155' text-anchor='middle'>H3C S9825 × 2　C22/D22 U17</text>

<line x1='180' y1='832' x2='1130' y2='866' stroke='#1f2937' stroke-width='2'/>
<line x1='496' y1='832' x2='1130' y2='866' stroke='#1f2937' stroke-width='2'/>
<line x1='812' y1='832' x2='1130' y2='866' stroke='#1f2937' stroke-width='2'/>

<rect x='980' y='858' width='330' height='60' rx='7' fill='#1f2937'/>
<text x='1145' y='882' font-size='13' font-weight='700' fill='#ffffff' text-anchor='middle'>出口路由器　H3C CR16005E × 2</text>
<text x='1145' y='903' font-size='10.5' fill='#94a3b8' text-anchor='middle'>C22 列 U13 / D22 列 U13　·　全中心南北向统一出口</text>

<rect x='30' y='846' width='930' height='72' rx='7' fill='#ffffff' stroke='#64748b' stroke-width='1.5'/>
<text x='46' y='868' font-size='11.5' font-weight='700' fill='#0f172a'>为什么核心上行带宽远小于骨干交换容量，却不是瓶颈</text>
<text x='46' y='888' font-size='10.5' fill='#334155'>存储读写与训练集合通信都是东西向流量，在各自的 Spine / 骨干层就地闭合，不经核心、更不经出口路由器。</text>
<text x='46' y='908' font-size='10.5' font-weight='600' fill='#9a3412'>核心与出口只承载南北向：管理访问、对外互联、监控上报。评估存储性能应看骨干下行端口数与 Leaf 上行收敛比。</text>
</svg>
